<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FamilyManager Pro · 家庭管理器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#dfe6d4;
    --board:#c7a877;
    --card:#fffdf6;
    --card-alt:#fff7e4;
    --ink:#3a332b;
    --ink-soft:#736a5c;
    --ink-faint:#a89d8a;
    --line: rgba(58,51,43,0.14);
    --pin:#c8503f;
    --shadow: 0 10px 22px rgba(40,32,18,0.18), 0 2px 4px rgba(40,32,18,0.12);

    --tasks:#d99b2b;      --tasks-soft:#f6e3b0;
    --calendar:#4d7fab;   --calendar-soft:#cfe1ef;
    --shopping:#5c8c4c;   --shopping-soft:#dcecd3;
    --study:#3f8f7c;      --study-soft:#cfe7df;
    --rewards:#b8567e;    --rewards-soft:#f3d9e4;

    --radius: 10px;
    --font-hand: 'Ma Shan Zheng', cursive;
    --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    --font-num: 'Inter', var(--font-body);
  }
  html.dark{
    --bg:#1c1914; --board:#3c3427; --card:#2c2721; --card-alt:#332c23;
    --ink:#ede4d4; --ink-soft:#bcaf99; --ink-faint:#8a7d68;
    --line: rgba(237,228,212,0.12); --pin:#e06a53;
    --shadow: 0 10px 24px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.35);
    --tasks-soft:#4a3f24; --calendar-soft:#233846; --shopping-soft:#293a24;
    --study-soft:#203a32; --rewards-soft:#3f2634;
  }

  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; background: var(--bg); color: var(--ink); font-family: var(--font-body); transition: background .3s ease, color .3s ease; position:relative;}
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  #auth-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .auth-card{width:100%; max-width:420px; background:var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding:36px 32px 30px; position:relative; transform:rotate(-0.4deg);}
  .pin{width:14px;height:14px;border-radius:50%; background: radial-gradient(circle at 35% 30%, #ff8a75, var(--pin)); box-shadow: 0 3px 5px rgba(0,0,0,.35); position:absolute; top:-7px; left:50%; transform:translateX(-50%);}
  .auth-title{font-family:var(--font-hand); font-size:44px; text-align:center; margin:6px 0 0; color:var(--ink);}
  .auth-sub{text-align:center; color:var(--ink-soft); font-size:13px; margin:0 0 22px; letter-spacing:.5px;}
  .tabbar{display:flex; gap:6px; background:var(--board); padding:4px; border-radius:999px; margin-bottom:22px;}
  .tabbar button{flex:1; border:none; background:transparent; padding:9px 0; border-radius:999px; font-weight:700; font-size:14px; color:#fff; opacity:.75;}
  .tabbar button.active{background:var(--card); color:var(--ink); opacity:1;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%; padding:10px 12px; border-radius:8px; border:1.5px solid var(--line); background:var(--card-alt); color:var(--ink); font-size:14px; outline:none; resize:vertical;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--tasks);}
  .radio-row{display:flex; gap:10px; margin-bottom:14px;}
  .radio-opt{flex:1; border:1.5px solid var(--line); border-radius:8px; padding:9px; text-align:center; font-size:13px; font-weight:600; color:var(--ink-soft); background:var(--card-alt);}
  .radio-opt.sel{border-color:var(--tasks); color:var(--tasks); background:var(--tasks-soft);}
  .primary-btn{width:100%; padding:12px; border:none; border-radius:8px; background:var(--ink); color:var(--card); font-weight:700; font-size:14.5px; margin-top:6px;}
  .primary-btn:hover{opacity:.92;}
  .primary-btn:disabled{opacity:.55;cursor:not-allowed;}
  .form-msg{font-size:12.5px; color:var(--pin); margin:-6px 0 12px; min-height:14px;}
  .form-msg.ok{color:var(--shopping);}
  .hint{font-size:12px; color:var(--ink-faint); margin:-8px 0 14px; line-height:1.5;}

  #app-screen{display:none; min-height:100vh;}
  .shell{display:grid; grid-template-columns:220px 1fr; min-height:100vh;}
  .sidebar{background:var(--board); padding:22px 14px; display:flex; flex-direction:column; gap:6px; position:relative;}
  .brand{font-family:var(--font-hand); color:#fff8ea; font-size:30px; text-align:center; margin:0 0 4px;}
  .brand-sub{text-align:center; color:rgba(255,255,255,.75); font-size:11px; margin-bottom:20px; letter-spacing:.5px;}
  .navitem{display:flex; align-items:center; gap:9px; padding:10px 12px; border-radius:8px; border:none; background:transparent; color:rgba(255,255,255,.82); font-size:14px; font-weight:600; text-align:left;}
  .navitem .ico{font-size:16px;}
  .navitem:hover{background:rgba(255,255,255,.12);}
  .navitem.active{background:var(--card); color:var(--ink); box-shadow: var(--shadow);}
  .nav-badge{margin-left:auto; background:var(--pin); color:#fff; font-size:10px; font-weight:800; padding:1px 6px; border-radius:999px;}
  .sidebar-foot{margin-top:auto; padding-top:14px; border-top:1px solid rgba(255,255,255,.18);}
  .userchip{display:flex; align-items:center; gap:9px; padding:8px 6px; color:#fff;}
  .avatar{width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:#fff; flex-shrink:0;}
  .userchip .who{line-height:1.25;}
  .userchip .name{font-size:13px; font-weight:700;}
  .userchip .role{font-size:11px; opacity:.8;}
  .userchip .pts{font-size:11px; opacity:.9; font-weight:700; margin-top:1px;}
  .logout-btn{width:100%; margin-top:8px; background:rgba(0,0,0,.18); border:none; color:#fff; padding:8px; border-radius:7px; font-size:12.5px; font-weight:700;}

  .main{padding:26px 34px 60px; background-image: radial-gradient(circle at 8% 12%, rgba(0,0,0,.05) 0, transparent 40%), radial-gradient(circle at 92% 82%, rgba(0,0,0,.05) 0, transparent 40%);}
  .main-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
  .main-title{font-family:var(--font-hand); font-size:34px; margin:0;}
  .main-title .accent-dot{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px;}
  .main-desc{color:var(--ink-soft); font-size:13px; margin:2px 0 0;}
  .head-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .points-pill{background:var(--rewards-soft); color:var(--rewards); font-weight:800; font-size:13px; padding:8px 14px; border-radius:999px; font-family:var(--font-num);}
  .sync-badge{background:var(--card-alt); border:1.5px solid var(--line); color:var(--ink-soft); padding:8px 12px; border-radius:999px; font-size:12px; font-weight:700; cursor:pointer;}
  .dark-toggle{border:1.5px solid var(--line); background:var(--card); color:var(--ink); padding:8px 14px; border-radius:999px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px;}
  .bell-btn{border:1.5px solid var(--line); background:var(--card); color:var(--ink); padding:8px 14px; border-radius:999px; font-size:13px; font-weight:700;}
  .badge{background:var(--pin); color:#fff; font-size:10px; font-weight:800; padding:1px 6px; border-radius:999px; margin-left:3px;}

  .notif-wrap{position:relative;}
  .notif-panel{position:absolute; top:110%; right:0; width:290px; background:var(--card); border-radius:10px; box-shadow:var(--shadow); padding:8px; z-index:80; max-height:340px; overflow-y:auto;}
  .notif-panel-title{font-weight:800; font-size:12.5px; color:var(--ink-soft); padding:6px 8px;}
  .notif-item{display:flex; gap:8px; align-items:flex-start; padding:9px 8px; border-radius:8px; font-size:13px; cursor:pointer;}
  .notif-item:hover{background:var(--card-alt);}

  .toast-stack{position:fixed; top:16px; right:16px; z-index:999; display:flex; flex-direction:column; gap:10px; max-width:300px;}
  .toast{background:var(--card); box-shadow:var(--shadow); border-radius:10px; padding:12px 14px; font-size:13px; font-weight:700; border-left:5px solid var(--tasks); animation: slidein .25s ease; transition:opacity .4s;}
  @keyframes slidein{from{transform:translateX(30px);opacity:0;} to{transform:translateX(0);opacity:1;}}

  .board-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:18px;}
  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 16px 14px; position:relative;}
  .card .pin{top:-7px;}
  .panel{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 22px; margin-bottom:22px;}
  .panel h3{margin:0 0 14px; font-size:15px; font-weight:800;}
  .panel p.sub{margin:-10px 0 14px; font-size:12.5px; color:var(--ink-soft);}
  .row{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;}
  .row .field{flex:1; min-width:140px; margin-bottom:0;}
  .btn{border:none; border-radius:8px; padding:10px 16px; font-weight:700; font-size:13.5px; color:#fff;}
  .btn-sm{padding:6px 11px; font-size:12px; border-radius:7px;}
  .btn-ghost{background:transparent; border:1.5px solid var(--line); color:var(--ink-soft);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .chip{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700;}

  .task-card{border-top:5px solid var(--tasks);}
  .task-card.done{opacity:.6;}
  .task-title{font-size:15px; font-weight:800; margin:2px 0 6px;}
  .task-title.strike{text-decoration:line-through; color:var(--ink-faint);}
  .task-meta{font-size:12px; color:var(--ink-soft); margin:2px 0;}
  .task-points{font-family:var(--font-num); font-weight:800; color:var(--tasks); font-size:13px;}
  .task-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}

  .event-card{border-top:5px solid var(--calendar);}
  .event-date{font-family:var(--font-num); font-weight:800; font-size:20px; color:var(--calendar);}
  .event-date .y{font-size:11px; color:var(--ink-faint); font-weight:600; display:block;}
  .tape{position:absolute; top:-9px; right:14px; width:44px; height:16px; background:var(--calendar-soft); opacity:.9; transform:rotate(3deg);}

  .shop-card{border-top:5px solid var(--shopping);}
  .shop-list{list-style:none; margin:0; padding:0;}
  .shop-list li{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px dashed var(--line); font-size:14px;}
  .shop-list li:last-child{border-bottom:none;}
  .shop-list li.done span.txt{text-decoration:line-through; color:var(--ink-faint);}
  .check{width:20px; height:20px; border-radius:6px; border:2px solid var(--shopping); display:flex; align-items:center; justify-content:center; flex-shrink:0; background:transparent; color:var(--shopping); font-weight:900; font-size:13px;}
  .check.on{background:var(--shopping); color:#fff;}

  .study-card{border-top:5px solid var(--study);}
  .study-badge{background:var(--study-soft); color:var(--study);}
  .pending-badge{background:var(--tasks-soft); color:var(--tasks);}
  .mini-row{display:flex; gap:8px; margin-top:10px; align-items:center;}
  .mini-input{width:80px; padding:7px 9px; border-radius:7px; border:1.5px solid var(--line); background:var(--card-alt); color:var(--ink); font-size:13px;}

  .reward-card{border-top:5px solid var(--rewards);}
  .cost-tag{font-family:var(--font-num); font-weight:800; color:var(--rewards); font-size:18px;}
  .msg-card{border-top:5px solid var(--rewards);}

  .role-badge-admin{background:var(--tasks-soft); color:var(--tasks);}
  .role-badge-member{background:var(--calendar-soft); color:var(--calendar);}
  .role-badge-child{background:var(--study-soft); color:var(--study);}

  .member-row{display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px dashed var(--line); flex-wrap:wrap;}
  .member-row:last-child{border-bottom:none;}
  .invite-box{display:flex; align-items:center; gap:10px; background:var(--card-alt); border:1.5px dashed var(--line); padding:12px 16px; border-radius:10px; margin-bottom:18px; flex-wrap:wrap;}
  .invite-code{font-family:var(--font-num); font-weight:800; letter-spacing:1px; font-size:16px; color:var(--tasks); word-break:break-all;}
  .empty-state{text-align:center; color:var(--ink-faint); padding:30px 10px; font-size:13.5px;}
  select.role-select{padding:5px 8px; border-radius:6px; border:1.5px solid var(--line); background:var(--card-alt); color:var(--ink); font-size:12px; font-weight:700;}
  hr.soft{border:none; border-top:1px solid var(--line); margin:16px 0;}
  .perm-table{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px;}
  .perm-table th, .perm-table td{padding:8px 6px; text-align:left; border-bottom:1px dashed var(--line);}
  .perm-table th{color:var(--ink-soft); font-weight:700;}

  @media (max-width: 760px){
    .shell{grid-template-columns:1fr;}
    .sidebar{flex-direction:row; overflow-x:auto; align-items:center; padding:12px;}
    .brand,.brand-sub{display:none;}
    .navitem{white-space:nowrap;}
    .sidebar-foot{display:none;}
    .main{padding:18px;}
  }
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-card">
    <div class="pin"></div>
    <h1 class="auth-title">FamilyManager Pro</h1>
    <p class="auth-sub">家务 · 日历 · 购物 · 学习 · 积分商店 · 留言板</p>

    <div class="tabbar">
      <button id="tab-login-btn" class="active" onclick="switchAuthTab('login')">登录</button>
      <button id="tab-register-btn" onclick="switchAuthTab('register')">注册</button>
    </div>

    <div id="login-form">
      <div class="field"><label>用户名</label><input type="text" id="login-username" placeholder="输入用户名" autocomplete="username"></div>
      <div class="field"><label>密码</label><input type="password" id="login-password" placeholder="输入密码" autocomplete="current-password"></div>
      <div class="form-msg" id="login-msg"></div>
      <button class="primary-btn" id="login-btn" onclick="handleLogin()">登录账号</button>
    </div>

    <div id="register-form" style="display:none;">
      <div class="field"><label>显示昵称</label><input type="text" id="reg-displayname" placeholder="例如：爸爸 / Jasper"></div>
      <div class="field"><label>用户名</label><input type="text" id="reg-username" placeholder="登录用的用户名" autocomplete="username"></div>
      <div class="field"><label>密码</label><input type="password" id="reg-password" placeholder="设置密码" autocomplete="new-password"></div>
      <div class="field"><label>确认密码</label><input type="password" id="reg-password2" placeholder="再次输入密码" autocomplete="new-password"></div>

      <div class="radio-row">
        <div class="radio-opt sel" id="opt-create" onclick="setFamilyMode('create')">🏠 创建新家庭</div>
        <div class="radio-opt" id="opt-join" onclick="setFamilyMode('join')">🔑 加入已有家庭</div>
      </div>

      <div id="family-create-field" class="field">
        <label>家庭名称</label>
        <input type="text" id="reg-familyname" placeholder="例如：陈家小屋">
        <div class="hint" style="margin-top:8px;">创建时会自动尝试连接云端，这样邀请码可以在任何联网设备上使用；若云端暂时不可用，会退回到"仅本设备可用"的邀请码。</div>
      </div>
      <div id="family-join-field" class="field" style="display:none;">
        <label>家庭邀请码</label>
        <input type="text" id="reg-familycode" placeholder="向家庭管理员索取邀请码">
        <div class="hint" style="margin-top:8px;">加入后默认是"家庭成员"身份，管理员之后可以调整为「儿童」或「管理员」。跨设备加入需要联网。</div>
      </div>

      <div class="form-msg" id="reg-msg"></div>
      <button class="primary-btn" id="reg-btn" onclick="handleRegister()">创建账号</button>
    </div>
  </div>
</div>

<div id="app-screen">
  <div id="toast-stack" class="toast-stack"></div>
  <div class="shell">
    <div class="sidebar">
      <div class="brand">🏠 家庭管理器</div>
      <div class="brand-sub" id="family-name-label">FAMILY</div>

      <button class="navitem" data-tab="tasks" onclick="switchTab('tasks')"><span class="ico">📝</span>家务任务</button>
      <button class="navitem" data-tab="calendar" onclick="switchTab('calendar')"><span class="ico">📅</span>家庭日历</button>
      <button class="navitem" data-tab="shopping" onclick="switchTab('shopping')"><span class="ico">🛒</span>购物清单</button>
      <button class="navitem" data-tab="study" onclick="switchTab('study')"><span class="ico">📚</span>学习成长</button>
      <button class="navitem" data-tab="rewards" onclick="switchTab('rewards')"><span class="ico">🎁</span>积分商店</button>
      <button class="navitem" data-tab="messages" onclick="switchTab('messages')"><span class="ico">💬</span>家庭留言板<span id="nav-badge-messages" class="nav-badge" style="display:none;"></span></button>
      <button class="navitem" data-tab="members" id="nav-members" onclick="switchTab('members')"><span class="ico">👨‍👩‍👧</span>家庭成员</button>
      <button class="navitem" data-tab="settings" onclick="switchTab('settings')"><span class="ico">⚙️</span>设置</button>

      <div class="sidebar-foot">
        <div class="userchip">
          <div class="avatar" id="side-avatar">?</div>
          <div class="who">
            <div class="name" id="side-name">-</div>
            <div class="role" id="side-role">-</div>
            <div class="pts" id="side-points">⭐ 0 积分</div>
          </div>
        </div>
        <button class="logout-btn" onclick="handleLogout()">退出登录</button>
      </div>
    </div>

    <div class="main" id="main-content"></div>
  </div>
</div>

<script>
/* ========================================================================
   FamilyManager Pro — 单文件本地应用
   本地数据保存在浏览器 localStorage 中；若"云同步"连接成功，家庭数据还会
   镜像保存到一个第三方免费 JSON 存储服务（jsonblob.com）上的共享地址，
   从而让邀请码可以在其它联网设备上使用、数据可以跨设备同步。
   这只是一个轻量的"尽力而为"方案，不是自建服务器，请勿存放高度敏感信息，
   也不保证第三方服务始终可用；云端不可用时应用会自动退回到本机模式。

   角色与权限设计：
     · 管理员 admin  —— 家长/负责人：管理成员与角色、发布/删除任务、管理
                        日历与购物、布置学习任务、审核儿童学习打卡、管理
                        积分商店与兑换审批。
     · 家庭成员 member —— 完成自己的任务、自由增删日历/购物、自主记录学习
                        （自动生效）、可申请用积分兑换奖励（需管理员审批）。
     · 儿童 child —— 只能查看/完成分配给自己的任务，日历只读，购物只能
                        勾选购买，学习记录需管理员确认后才计分，兑换奖励
                        同样需要审批。
   ======================================================================== */

const STORAGE_KEY = 'fmpro_state_v4';
const CLOUD_API_BASE = 'https://jsonblob.com/api/jsonBlob';

let state = null;
let currentTab = 'tasks';
let familyModeChoice = 'create';
let syncStatus = 'idle';
let sessionNotifiedIds = new Set();

const AVATAR_COLORS = ['#d99b2b','#4d7fab','#5c8c4c','#3f8f7c','#b8567e','#7e6ab8','#a1653f'];
const ROLE_LABEL = { admin:'👑 管理员', member:'家庭成员', child:'🧒 儿童' };
const ROLE_BADGE_CLASS = { admin:'role-badge-admin', member:'role-badge-member', child:'role-badge-child' };

/* ---------------- storage ---------------- */
function defaultState(){
  return {
    users: [], families: [], tasks: [], events: [], shopping: [],
    study: [], rewards: [], redemptions: [], messages: [],
    session: { userId: null }, theme: 'light'
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    return Object.assign(defaultState(), JSON.parse(raw));
  }catch(e){
    console.error('加载数据失败，使用初始状态', e);
    return defaultState();
  }
}
function saveStateLocalOnly(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function saveState(){
  saveStateLocalOnly();
  const m = me();
  if(m) schedulePush(m.familyId);
}

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function genFamilyCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<6;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
async function hashPassword(pw){
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function avatarColorFor(userId){
  let h=0; for(const ch of userId) h=(h*31+ch.charCodeAt(0))%AVATAR_COLORS.length;
  return AVATAR_COLORS[Math.abs(h)];
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){
  const d1=new Date(a+'T00:00:00'), d2=new Date(b+'T00:00:00');
  return Math.round((d2-d1)/(1000*60*60*24));
}
function formatDT(ts){
  const d = new Date(ts);
  return `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

/* ---------------- cloud sync ---------------- */
async function cloudCreate(payload){
  const res = await fetch(CLOUD_API_BASE, { method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body: JSON.stringify(payload) });
  if(!res.ok) throw new Error('cloud create failed: '+res.status);
  const loc = res.headers.get('Location') || res.headers.get('location');
  if(!loc) throw new Error('未能获取云端地址（可能是网络限制了响应头）');
  const id = loc.split('/').filter(Boolean).pop();
  if(!id) throw new Error('无法解析云端 ID');
  return id;
}
async function cloudGet(id){
  const res = await fetch(CLOUD_API_BASE + '/' + encodeURIComponent(id), { headers:{'Accept':'application/json'} });
  if(!res.ok) throw new Error('cloud get failed: '+res.status);
  return await res.json();
}
async function cloudPut(id, payload){
  const res = await fetch(CLOUD_API_BASE + '/' + encodeURIComponent(id), { method:'PUT', headers:{'Content-Type':'application/json','Accept':'application/json'}, body: JSON.stringify(payload) });
  if(!res.ok) throw new Error('cloud put failed: '+res.status);
  return true;
}
function familyCloudPayload(familyId){
  return {
    family: state.families.find(f=>f.id===familyId),
    users: state.users.filter(u=>u.familyId===familyId),
    tasks: state.tasks.filter(t=>t.familyId===familyId),
    events: state.events.filter(e=>e.familyId===familyId),
    shopping: state.shopping.filter(s=>s.familyId===familyId),
    study: state.study.filter(s=>s.familyId===familyId),
    rewards: state.rewards.filter(r=>r.familyId===familyId),
    redemptions: state.redemptions.filter(r=>r.familyId===familyId),
    messages: state.messages.filter(x=>x.familyId===familyId),
    updatedAt: Date.now()
  };
}
function mergeCloudPayloadIntoLocal(payload){
  if(!payload || !payload.family) return;
  const fid = payload.family.id;
  state.families = state.families.filter(f=>f.id!==fid);
  state.families.push(payload.family);
  const scopes = [
    ['users', payload.users], ['tasks', payload.tasks], ['events', payload.events],
    ['shopping', payload.shopping], ['study', payload.study], ['rewards', payload.rewards],
    ['redemptions', payload.redemptions], ['messages', payload.messages]
  ];
  scopes.forEach(([key, arr])=>{
    state[key] = state[key].filter(x=>x.familyId!==fid).concat(arr||[]);
  });
}
let pushTimer = null;
function schedulePush(familyId){
  const fam = state.families.find(f=>f.id===familyId);
  if(!fam || !fam.cloudSynced) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>{ pushFamilyToCloud(familyId); }, 1200);
}
async function pushFamilyToCloud(familyId){
  const fam = state.families.find(f=>f.id===familyId);
  if(!fam || !fam.cloudSynced) return;
  try{
    setSyncStatus('syncing');
    await cloudPut(fam.cloudId, familyCloudPayload(familyId));
    setSyncStatus('synced');
  }catch(e){
    console.warn('云同步推送失败', e);
    setSyncStatus('error');
  }
}
async function pullFamilyFromCloud(familyId){
  const fam = state.families.find(f=>f.id===familyId);
  if(!fam || !fam.cloudSynced) return false;
  try{
    setSyncStatus('syncing');
    const payload = await cloudGet(fam.cloudId);
    mergeCloudPayloadIntoLocal(payload);
    saveStateLocalOnly();
    setSyncStatus('synced');
    return true;
  }catch(e){
    console.warn('云同步拉取失败', e);
    setSyncStatus('error');
    return false;
  }
}
function setSyncStatus(s){ syncStatus = s; updateSyncBadge(); }
function updateSyncBadge(){
  const el = document.getElementById('sync-badge'); if(!el) return;
  const fam = myFamily(); if(!fam){ return; }
  if(!fam.cloudSynced){ el.textContent='💾 本机模式'; el.title='当前家庭未连接云端，邀请码仅本设备可用，点击可在设置页重试连接'; return; }
  const map = { synced:'☁️ 已同步', error:'⚠️ 同步失败', syncing:'☁️ 同步中…', idle:'☁️ 已连接' };
  el.textContent = map[syncStatus] || '☁️ 已连接';
  el.title = '点击立即同步';
}
function manualSync(){
  const m = me(); if(!m) return;
  const fam = myFamily();
  if(!fam || !fam.cloudSynced){ showToast('💾','当前为本机模式，暂无云端可同步','var(--ink-soft)'); return; }
  showToast('☁️','正在同步…','var(--calendar)');
  pullFamilyFromCloud(m.familyId).then(ok=>{
    refreshSidebarChrome();
    switchTab(currentTab);
    showToast(ok?'✅':'⚠️', ok?'同步完成':'同步失败，请检查网络', ok?'var(--shopping)':'var(--pin)');
  });
}
function retryCloudSync(){
  const fam = myFamily(); if(!fam) return;
  showToast('☁️','正在尝试连接云端…','var(--calendar)');
  cloudCreate(familyCloudPayload(fam.id)).then(id=>{
    fam.cloudId = id; fam.cloudSynced = true; fam.code = id;
    saveState();
    refreshSidebarChrome();
    switchTab(currentTab);
    showToast('✅','云同步已开启，邀请码已更新','var(--shopping)');
  }).catch(()=>{ showToast('⚠️','云端连接失败，请稍后再试','var(--pin)'); });
}
function copyInviteCode(){
  const fam = myFamily(); if(!fam) return;
  navigator.clipboard?.writeText(fam.code).then(()=>{
    showToast('📋','邀请码已复制','var(--calendar)');
  }).catch(()=>{ showToast('⚠️','复制失败，请手动选中复制','var(--pin)'); });
}

/* ---------------- toasts ---------------- */
function showToast(icon, text, color){
  const stack = document.getElementById('toast-stack'); if(!stack) return;
  const el = document.createElement('div');
  el.className='toast'; el.style.borderLeftColor = color || 'var(--tasks)';
  el.innerHTML = `${icon} ${escapeHtml(text)}`;
  stack.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 6000);
}

async function handleRegister(){
  const msgEl = document.getElementById('reg-msg');
  const btn = document.getElementById('reg-btn');
  msgEl.className='form-msg'; msgEl.textContent='';

  const displayName = document.getElementById('reg-displayname').value.trim();
  const username = document.getElementById('reg-username').value.trim();
  const password = document.getElementById('reg-password').value;
  const password2 = document.getElementById('reg-password2').value;

  if(!displayName || !username || !password){ msgEl.textContent='请完整填写昵称、用户名和密码'; return; }
  if(password.length < 4){ msgEl.textContent='密码至少 4 位'; return; }
  if(password !== password2){ msgEl.textContent='两次输入的密码不一致'; return; }
  if(state.users.some(u => u.username.toLowerCase() === username.toLowerCase())){ msgEl.textContent='用户名已被使用，换一个试试'; return; }

  btn.disabled = true;
  let familyId, role;

  if(familyModeChoice === 'create'){
    const familyName = document.getElementById('reg-familyname').value.trim();
    if(!familyName){ msgEl.textContent='请输入家庭名称'; btn.disabled=false; return; }
    const famRecord = { id: uid('fam'), name: familyName, code: genFamilyCode(), cloudId:null, cloudSynced:false, createdAt: Date.now() };
    msgEl.className='form-msg'; msgEl.style.color='var(--ink-soft)'; msgEl.textContent='正在尝试连接云端…';
    try{
      const initialPayload = { family: famRecord, users:[], tasks:[], events:[], shopping:[], study:[], rewards:[], redemptions:[], messages:[], updatedAt: Date.now() };
      const cloudId = await cloudCreate(initialPayload);
      famRecord.cloudId = cloudId; famRecord.code = cloudId; famRecord.cloudSynced = true;
    }catch(e){
      console.warn('云端创建失败，使用本机邀请码', e);
      famRecord.cloudSynced = false;
    }
    state.families.push(famRecord);
    familyId = famRecord.id; role = 'admin';
  }else{
    const rawCode = document.getElementById('reg-familycode').value.trim();
    if(!rawCode){ msgEl.textContent='请输入家庭邀请码'; btn.disabled=false; return; }
    msgEl.className='form-msg'; msgEl.style.color='var(--ink-soft)'; msgEl.textContent='正在查找家庭…';

    let famRecord = null;
    try{
      const cloudPayload = await cloudGet(rawCode);
      if(cloudPayload && cloudPayload.family){
        mergeCloudPayloadIntoLocal(cloudPayload);
        famRecord = state.families.find(f=>f.id===cloudPayload.family.id);
        famRecord.cloudSynced = true; famRecord.cloudId = rawCode; famRecord.code = rawCode;
      }
    }catch(e){ /* 不是有效云端ID，或离线，继续尝试本机匹配 */ }

    if(!famRecord){
      const upper = rawCode.toUpperCase();
      famRecord = state.families.find(f => f.code === upper || f.code === rawCode);
    }
    if(!famRecord){
      msgEl.className='form-msg'; msgEl.style.color='var(--pin)';
      msgEl.textContent='邀请码无效。请确认邀请码正确；跨设备加入需要联网以连接云端。';
      btn.disabled=false; return;
    }
    if(famRecord.cloudSynced === undefined) famRecord.cloudSynced = false;
    familyId = famRecord.id; role = 'member';
  }

  const passwordHash = await hashPassword(password);
  const user = { id: uid('u'), username, passwordHash, displayName, familyId, role, createdAt: Date.now() };
  state.users.push(user);
  state.session.userId = user.id;
  saveState();

  msgEl.className='form-msg ok'; msgEl.style.color='';
  msgEl.textContent='注册成功，正在进入…';
  btn.disabled=false;
  setTimeout(enterApp, 300);
}

async function handleLogin(){
  const msgEl = document.getElementById('login-msg');
  msgEl.textContent='';
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  if(!username || !password){ msgEl.textContent='请输入用户名和密码'; return; }

  const user = state.users.find(u => u.username.toLowerCase() === username.toLowerCase());
  if(!user){ msgEl.textContent='用户名不存在'; return; }
  const hash = await hashPassword(password);
  if(hash !== user.passwordHash){ msgEl.textContent='密码错误'; return; }

  state.session.userId = user.id;
  saveState();
  enterApp();
}
function handleLogout(){
  state.session.userId = null;
  saveStateLocalOnly();
  if(window.__fmproSyncInterval){ clearInterval(window.__fmproSyncInterval); window.__fmproSyncInterval=null; }
  document.getElementById('app-screen').style.display='none';
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('login-username').value='';
  document.getElementById('login-password').value='';
}

/* ---------------- context helpers ---------------- */
function me(){ return state.users.find(u => u.id === state.session.userId); }
function myFamily(){ const m = me(); return m ? state.families.find(f => f.id === m.familyId) : null; }
function familyUsers(){ const m = me(); return state.users.filter(u => u.familyId === m.familyId); }
function isAdmin(){ const m = me(); return !!m && m.role === 'admin'; }
function isChild(){ const m = me(); return !!m && m.role === 'child'; }
function userById(id){ return state.users.find(u=>u.id===id); }
function familyTasks(){ const m=me(); return state.tasks.filter(t=>t.familyId===m.familyId); }
function familyEvents(){ const m=me(); return state.events.filter(e=>e.familyId===m.familyId); }
function familyShopping(){ const m=me(); return state.shopping.filter(s=>s.familyId===m.familyId); }
function familyStudy(){ const m=me(); return state.study.filter(s=>s.familyId===m.familyId); }
function familyRewards(){ const m=me(); return state.rewards.filter(r=>r.familyId===m.familyId); }
function familyRedemptions(){ const m=me(); return state.redemptions.filter(r=>r.familyId===m.familyId); }
function familyMessages(){ const m=me(); return state.messages.filter(x=>x.familyId===m.familyId); }

/* ---------------- points engine ---------------- */
function calcStudyPoints(minutes){ return Math.max(1, Math.round(minutes/10)); }
function userTaskPoints(userId){ return state.tasks.filter(t=>t.assigneeId===userId && t.status==='done').reduce((s,t)=>s+t.points,0); }
function userStudyPoints(userId){ return state.study.filter(s=>s.assigneeId===userId && s.status==='done').reduce((s,x)=>s+(x.points||0),0); }
function userEarnedPoints(userId){ return userTaskPoints(userId) + userStudyPoints(userId); }
function userSpentPoints(userId){
  return state.redemptions.filter(r=>r.memberId===userId && r.status==='approved')
    .reduce((s,r)=>{ const rw = state.rewards.find(x=>x.id===r.rewardId); return s+(rw?rw.cost:0); },0);
}
function userPendingPoints(userId){
  return state.redemptions.filter(r=>r.memberId===userId && r.status==='pending')
    .reduce((s,r)=>{ const rw = state.rewards.find(x=>x.id===r.rewardId); return s+(rw?rw.cost:0); },0);
}
function userAvailablePoints(userId){ return userEarnedPoints(userId) - userSpentPoints(userId) - userPendingPoints(userId); }

/* ---------------- reminders ---------------- */
function computeReminders(){
  const m = me(); if(!m) return [];
  const list = [];
  const today = todayStr();

  familyTasks().filter(t=>t.status==='pending' && t.assigneeId===m.id && t.dueDate && t.dueDate<=today).forEach(t=>{
    const overdue = t.dueDate < today;
    list.push({ id:'task_'+t.id, icon:'📝', text:(overdue?'已逾期：':'今天要完成：')+t.title, tab:'tasks', color:'var(--tasks)' });
  });
  familyEvents().forEach(e=>{
    if(!e.date) return;
    const diff = daysBetween(today, e.date);
    if(diff>=0 && diff<=2){
      list.push({ id:'event_'+e.id, icon:'📅', text:(diff===0?'今天：':diff+'天后：')+e.title, tab:'calendar', color:'var(--calendar)' });
    }
  });
  familyMessages().filter(msg=>(msg.toId===null||msg.toId===m.id) && msg.fromId!==m.id && !(msg.readBy||[]).includes(m.id))
    .forEach(msg=>{
      list.push({ id:'msg_'+msg.id, icon:'💬', text:(userById(msg.fromId)?.displayName||'有人')+' 给你留言了', tab:'messages', color:'var(--rewards)' });
    });
  if(isAdmin()){
    const pr = familyStudy().filter(s=>s.status==='pending_review').length;
    if(pr) list.push({ id:'study_review', icon:'📚', text:`有 ${pr} 条学习记录待确认`, tab:'study', color:'var(--study)' });
    const pd = familyRedemptions().filter(r=>r.status==='pending').length;
    if(pd) list.push({ id:'redeem_pending', icon:'🎁', text:`有 ${pd} 个兑换申请待审批`, tab:'rewards', color:'var(--rewards)' });
  }
  return list;
}
function runReminderCheck(){
  const reminders = computeReminders();
  reminders.slice(0,5).forEach(r=>{
    if(!sessionNotifiedIds.has(r.id)){
      sessionNotifiedIds.add(r.id);
      showToast(r.icon, r.text, r.color);
      if(window.Notification && Notification.permission==='granted'){
        try{ new Notification('FamilyManager Pro', { body:r.text }); }catch(e){}
      }
    }
  });
}
function notifStatusLabel(){

  return { granted:'✅ 已开启', denied:'🚫 已被拒绝（请在浏览器设置中开启）', default:'尚未开启' }[Notification.permission];
}

});

/* ---------------- app shell ---------------- */
function refreshSidebarChrome(){
  const m = me(); if(!m) return;
  const fam = myFamily();
  document.getElementById('family-name-label').textContent = fam ? fam.name.toUpperCase() : '';
  document.getElementById('side-name').textContent = m.displayName;
  document.getElementById('side-role').textContent = ROLE_LABEL[m.role];
  const av = document.getElementById('side-avatar');
  av.textContent = m.displayName.slice(0,1);
  av.style.background = avatarColorFor(m.id);
  document.getElementById('nav-members').style.display = isAdmin() ? 'flex' : 'none';
  refreshSidebarPoints();
  updateNavBadges();
}
function refreshSidebarPoints(){
  const m = me(); if(!m) return;
  document.getElementById('side-points').textContent = `⭐ ${userAvailablePoints(m.id)} 积分`;
}
function updateNavBadges(){
  const m = me(); if(!m) return;
  const unread = familyMessages().filter(msg=>(msg.toId===null||msg.toId===m.id) && msg.fromId!==m.id && !(msg.readBy||[]).includes(m.id)).length;
  const el = document.getElementById('nav-badge-messages');
  if(el){ el.style.display = unread>0 ? 'inline-block':'none'; el.textContent = unread; }
}

function enterApp(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
  refreshSidebarChrome();
  if(!isAdmin() && currentTab==='members') currentTab='tasks';

  const m = me();
  if(!window.__fmproSyncInterval){
    window.__fmproSyncInterval = setInterval(()=>{
      const mm = me(); if(!mm) return;
      pullFamilyFromCloud(mm.familyId).then(changed=>{
        if(changed){ refreshSidebarChrome(); switchTab(currentTab); }
        runReminderCheck();
      });
    }, 20000);
  }
  pullFamilyFromCloud(m.familyId).then(()=>{
    refreshSidebarChrome();
    switchTab(currentTab);
    runReminderCheck();
  });
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.navitem').forEach(el=>{ el.classList.toggle('active', el.dataset.tab === tab); });
  const renderers = {
    tasks: renderTasksTab, calendar: renderCalendarTab, shopping: renderShoppingTab,
    study: renderStudyTab, rewards: renderRewardsTab, messages: renderMessagesTab,
    members: renderMembersTab, settings: renderSettingsTab
  };
  refreshSidebarPoints();
  (renderers[tab] || renderTasksTab)();
  updateSyncBadge();
  updateNavBadges();
}

function toggleDark(){
  state.theme = state.theme==='dark' ? 'light':'dark';
  document.documentElement.classList.toggle('dark', state.theme==='dark');
  saveState();
  switchTab(currentTab);
}

/* ============================================================
   TASKS TAB
   ============================================================ */
function renderTasksTab(){
  const main = document.getElementById('main-content');
  const m = me();
  const users = familyUsers();
  const admin = isAdmin();
  const assigneeOptions = users.map(u=>`<option value="${u.id}">${escapeHtml(u.displayName)}（${ROLE_LABEL[u.role].replace('👑 ','').replace('🧒 ','')}）</option>`).join('');

  let formHtml = '';
  if(admin){
    formHtml = `
      <div class="panel">
        <h3>➕ 发布新任务</h3>
        <div class="row">
          <div class="field"><label>任务内容</label><input type="text" id="task-title" placeholder="例如：洗碗"></div>
          <div class="field"><label>负责人</label><select id="task-assignee">${assigneeOptions}</select></div>
          <div class="field"><label>截止日期</label><input type="date" id="task-due"></div>
          <div class="field" style="max-width:100px;"><label>积分</label><input type="number" id="task-points" value="10" min="1"></div>
          <button class="btn" style="background:var(--tasks);" onclick="addTask()">发布任务</button>
        </div>
      </div>`;
  }

  const all = familyTasks().sort((a,b)=> (a.status==='done')-(b.status==='done') || (a.dueDate||'').localeCompare(b.dueDate||''));
  const visible = admin ? all : all.filter(t => t.assigneeId === m.id);

  const cards = visible.map(t=>{
    const assignee = userById(t.assigneeId);
    const done = t.status === 'done';
    const canComplete = !done && t.assigneeId === m.id;
    return `
      <div class="card task-card ${done?'done':''}">
        <div class="pin"></div>
        <div class="task-title ${done?'strike':''}">${done?'✅':'⬜'} ${escapeHtml(t.title)}</div>
        <div class="task-meta">负责人：${escapeHtml(assignee ? assignee.displayName : '未知')}</div>
        <div class="task-meta">截止：${t.dueDate ? escapeHtml(t.dueDate) : '未设置'}</div>
        <div class="task-meta">发布人：${escapeHtml(userById(t.createdBy)?.displayName || '—')}</div>
        ${done ? `<div class="task-meta">完成时间：${escapeHtml(t.completedAt || '')}</div>` : ''}
        <div class="task-meta task-points">+${t.points} 分</div>
        <div class="task-actions">
          ${canComplete ? `<button class="btn btn-sm" style="background:var(--tasks);" onclick="completeTask('${t.id}')">完成 ✅</button>` : ''}
          ${admin ? `<button class="btn btn-sm btn-ghost" onclick="deleteTask('${t.id}')">删除</button>` : ''}
        </div>
      </div>`;
  }).join('');

  main.innerHTML = headHtml('📝','var(--tasks)','家务任务', admin ? '发布、分配并跟踪全家的家务任务' : '查看并完成分配给你的任务')
    + formHtml
    + `<div class="board-grid">${cards || `<div class="empty-state">暂时没有任务，${admin?'去发布第一个任务吧！':'等待管理员分配任务。'}</div>`}</div>`;
}
function addTask(){
  const title = document.getElementById('task-title').value.trim();
  const assigneeId = document.getElementById('task-assignee').value;
  const dueDate = document.getElementById('task-due').value;
  const points = parseInt(document.getElementById('task-points').value) || 10;
  if(!title){ alert('请输入任务内容'); return; }
  const m = me();
  state.tasks.push({ id: uid('task'), familyId: m.familyId, title, assigneeId, dueDate, createdBy: m.id, status:'pending', points, completedAt:null });
  saveState(); renderTasksTab();
}
function completeTask(taskId){
  const t = state.tasks.find(x=>x.id===taskId); if(!t) return;
  t.status='done'; t.completedAt = todayStr();
  saveState(); renderTasksTab(); refreshSidebarPoints();
}
function deleteTask(taskId){
  if(!confirm('确定删除这个任务吗？')) return;
  state.tasks = state.tasks.filter(t=>t.id!==taskId);
  saveState(); renderTasksTab();
}

  const pending = items.filter(i=>!i.done);

    const canDelete = isAdmin() || (!isChild() && i.addedBy === m.id);

        <div class="row">

        <div class="card shop-card" style="flex:1;min-width:260px;">
          <div class="pin"></div>
          <h3 style="margin-top:4px;">待购买 (${pending.length})</h3>
          <ul class="shop-list">${pending.map(li).join('') || '<li class="empty-state" style="border:none;">清单是空的 🎉</li>'}</ul>
        </div>
        <div class="card shop-card" style="flex:1;min-width:260px;opacity:.85;">
          <div class="pin"></div>
          <h3 style="margin-top:4px;">已购买 (${done.length})</h3>
          <ul class="shop-list">${done.map(li).join('') || '<li class="empty-state" style="border:none;">还没有已购买的物品</li>'}</ul>

function addShop(){
  if(isChild()){ alert('儿童身份暂不能添加物品'); return; }
  const name = document.getElementById('shop-name').value.trim();
  if(!name) return;
  const m = me();
  state.shopping.push({ id: uid('shop'), familyId: m.familyId, name, done:false, addedBy:m.id });
  saveState(); renderShoppingTab();
}
function toggleShop(id){
  const it = state.shopping.find(i=>i.id===id);
  if(it){ it.done = !it.done; saveState(); renderShoppingTab(); }
}
function deleteShop(id){
  state.shopping = state.shopping.filter(i=>i.id!==id);
  saveState(); renderShoppingTab();
}

/* ============================================================
   STUDY TAB
   ============================================================ */
function renderStudyTab(){
  const main = document.getElementById('main-content');
  const m = me();
  const admin = isAdmin();
  const users = familyUsers();
  const assigneeOptions = users.map(u=>`<option value="${u.id}">${escapeHtml(u.displayName)}</option>`).join('');

  const items = familyStudy();
  const goals = items.filter(s=>s.isAssigned && s.status==='pending_goal' && (admin || s.assigneeId===m.id));
  const pendingReview = items.filter(s=>s.status==='pending_review' && (admin || s.assigneeId===m.id));
  const doneItems = items.filter(s=>s.status==='done' && (admin || s.assigneeId===m.id))
    .sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));

  const assignPanel = admin ? `
    <div class="panel">
      <h3>🎯 布置学习任务</h3>
      <div class="row">
        <div class="field"><label>学习内容</label><input type="text" id="goal-title" placeholder="例如：阅读《三国演义》"></div>
        <div class="field"><label>分配给</label><select id="goal-assignee">${assigneeOptions}</select></div>
        <div class="field" style="max-width:120px;"><label>目标时长(分钟)</label><input type="number" id="goal-minutes" value="30" min="5"></div>
        <div class="field"><label>截止日期</label><input type="date" id="goal-due"></div>
        <button class="btn" style="background:var(--study);" onclick="addGoal()">布置任务</button>
      </div>
    </div>` : '';

  const logPanel = `
    <div class="panel">
      <h3>✏️ 记录学习</h3>
      <p class="sub">${isChild() ? '你记录的学习会先交给管理员确认，通过后才会获得积分。' : '记录会立即生效并获得积分。'}</p>
      <div class="row">
        <div class="field"><label>学习内容</label><input type="text" id="log-title" placeholder="例如：练琴 / 做数学题"></div>
        <div class="field" style="max-width:120px;"><label>时长(分钟)</label><input type="number" id="log-minutes" value="20" min="1"></div>
        <div class="field"><label>日期</label><input type="date" id="log-date" value="${todayStr()}"></div>
        <button class="btn" style="background:var(--study);" onclick="logStudy()">记录</button>
      </div>
    </div>`;

  function goalCard(s){
    const assignee = userById(s.assigneeId);
    return `
      <div class="card study-card">
        <div class="pin"></div>
        <div class="task-title">📖 ${escapeHtml(s.title)}</div>
        ${admin ? `<div class="task-meta">对象：${escapeHtml(assignee?.displayName||'—')}</div>` : ''}
        <div class="task-meta">目标：${s.targetMinutes} 分钟 · 截止 ${escapeHtml(s.dueDate||'—')}</div>
        ${s.assigneeId===m.id ? `
          <div class="mini-row">
            <input type="number" class="mini-input" id="goal-actual-${s.id}" placeholder="实际分钟" min="1">
            <button class="btn btn-sm" style="background:var(--study);" onclick="completeGoal('${s.id}')">打卡完成</button>
          </div>` : ''}
      </div>`;
  }
  function reviewCard(s){
    const assignee = userById(s.assigneeId);
    return `
      <div class="card study-card">
        <div class="pin"></div>
        <span class="chip pending-badge">待确认</span>
        <div class="task-title" style="margin-top:6px;">📖 ${escapeHtml(s.title)}</div>
        <div class="task-meta">来自：${escapeHtml(assignee?.displayName||'—')}</div>
        <div class="task-meta">时长：${s.actualMinutes} 分钟 · ${escapeHtml(s.date)}</div>
        <div class="task-meta">预计积分：+${calcStudyPoints(s.actualMinutes)} 分</div>
        ${admin ? `<div class="task-actions">
          <button class="btn btn-sm" style="background:var(--study);" onclick="approveStudy('${s.id}')">确认 ✅</button>
          <button class="btn btn-sm btn-ghost" onclick="rejectStudy('${s.id}')">驳回</button>
        </div>` : `<div class="task-meta" style="color:var(--tasks);">等待管理员确认…</div>`}
      </div>`;
  }
  function doneCard(s){
    const assignee = userById(s.assigneeId);
    return `
      <div class="card study-card done" style="opacity:.85;">
        <div class="pin"></div>
        <span class="chip study-badge">已完成</span>
        <div class="task-title" style="margin-top:6px;">📖 ${escapeHtml(s.title)}</div>
        ${admin ? `<div class="task-meta">学员：${escapeHtml(assignee?.displayName||'—')}</div>` : ''}
        <div class="task-meta">时长：${s.actualMinutes} 分钟 · ${escapeHtml(s.completedAt||s.date)}</div>
        <div class="task-meta task-points" style="color:var(--study);">+${s.points} 分</div>
      </div>`;
  }

  main.innerHTML = headHtml('📚','var(--study)','学习成长','布置学习任务、记录学习打卡，养成好习惯')
    + assignPanel + logPanel
    + `<div class="panel"><h3>🎯 待完成的学习任务 (${goals.length})</h3>
        <div class="board-grid">${goals.map(goalCard).join('') || '<div class="empty-state">暂时没有待完成的学习任务</div>'}</div></div>`
    + (pendingReview.length || admin ? `<div class="panel"><h3>⏳ 待确认 (${pendingReview.length})</h3>
        <div class="board-grid">${pendingReview.map(reviewCard).join('') || '<div class="empty-state">暂无待确认的记录</div>'}</div></div>` : '')
    + `<div class="panel"><h3>✅ 学习记录</h3>
        <div class="board-grid">${doneItems.map(doneCard).join('') || '<div class="empty-state">还没有已完成的学习记录</div>'}</div></div>`;
}
function addGoal(){
  const title = document.getElementById('goal-title').value.trim();
  const assigneeId = document.getElementById('goal-assignee').value;
  const targetMinutes = parseInt(document.getElementById('goal-minutes').value) || 30;
  const dueDate = document.getElementById('goal-due').value;
  if(!title){ alert('请输入学习内容'); return; }
  const m = me();
  state.study.push({
    id: uid('study'), familyId: m.familyId, title, assigneeId, createdBy: m.id,
    isAssigned:true, targetMinutes, actualMinutes:null, dueDate, date:null,
    status:'pending_goal', points:0, completedAt:null
  });
  saveState(); renderStudyTab();
}
function completeGoal(goalId){
  const s = state.study.find(x=>x.id===goalId); if(!s) return;
  const actual = parseInt(document.getElementById('goal-actual-'+goalId).value);
  if(!actual || actual<=0){ alert('请填写实际学习分钟数'); return; }
  s.actualMinutes = actual; s.date = todayStr();
  const assignee = userById(s.assigneeId);
  if(assignee.role === 'child'){ s.status = 'pending_review'; }
  else{ s.status = 'done'; s.points = calcStudyPoints(actual); s.completedAt = todayStr(); }
  saveState(); renderStudyTab(); refreshSidebarPoints();
}
function logStudy(){
  const title = document.getElementById('log-title').value.trim();
  const minutes = parseInt(document.getElementById('log-minutes').value);
  const date = document.getElementById('log-date').value || todayStr();
  if(!title || !minutes || minutes<=0){ alert('请填写学习内容和时长'); return; }
  const m = me();
  const entry = {
    id: uid('study'), familyId: m.familyId, title, assigneeId: m.id, createdBy: m.id,
    isAssigned:false, targetMinutes:null, actualMinutes: minutes, dueDate:null, date,
    status: m.role==='child' ? 'pending_review' : 'done',
    points: m.role==='child' ? 0 : calcStudyPoints(minutes),
    completedAt: m.role==='child' ? null : date
  };
  state.study.push(entry);
  saveState(); renderStudyTab(); refreshSidebarPoints();
}
function approveStudy(id){
  const s = state.study.find(x=>x.id===id); if(!s) return;
  s.status='done'; s.points = calcStudyPoints(s.actualMinutes); s.completedAt = todayStr();
  saveState(); renderStudyTab(); refreshSidebarPoints();
}
function rejectStudy(id){
  if(!confirm('驳回这条学习记录？该记录将被删除。')) return;
  state.study = state.study.filter(x=>x.id!==id);
  saveState(); renderStudyTab();
}

/* ============================================================
   REWARDS TAB
   ============================================================ */
function renderRewardsTab(){
  const main = document.getElementById('main-content');
  const m = me();
  const admin = isAdmin();
  const rewards = familyRewards();
  const redemptions = familyRedemptions();
  const myAvail = userAvailablePoints(m.id);

  const manageHtml = admin ? `
    <div class="panel">
      <h3>🛠️ 管理奖励</h3>
      <div class="row">
        <div class="field"><label>奖励名称</label><input type="text" id="rw-title" placeholder="例如：多看30分钟动画片"></div>
        <div class="field" style="max-width:120px;"><label>所需积分</label><input type="number" id="rw-cost" value="20" min="1"></div>
        <button class="btn" style="background:var(--rewards);" onclick="addReward()">添加奖励</button>
      </div>
      <hr class="soft">
      ${rewards.map(r=>`
        <div class="member-row">
          <div style="flex:1;font-weight:700;">${escapeHtml(r.title)}</div>
          <span class="chip" style="background:var(--rewards-soft);color:var(--rewards);">${r.cost} 积分</span>
          <button class="btn btn-sm btn-ghost" onclick="deleteReward('${r.id}')">删除</button>
        </div>`).join('') || '<div class="empty-state">还没有设置任何奖励</div>'}
    </div>` : '';

  const shopCards = rewards.map(r=>{
    const canRedeem = myAvail >= r.cost;
    return `
      <div class="card reward-card">
        <div class="pin"></div>
        <div class="task-title">🎁 ${escapeHtml(r.title)}</div>
        <div class="cost-tag">${r.cost} 积分</div>
        <div class="task-actions">
          <button class="btn btn-sm" style="background:var(--rewards);" ${canRedeem?'':'disabled'} onclick="redeemReward('${r.id}')">兑换</button>
        </div>
        ${canRedeem ? '' : `<div class="task-meta" style="margin-top:8px;color:var(--pin);">积分不足</div>`}
      </div>`;
  }).join('');

  const myRequests = redemptions.filter(r=> admin ? true : r.memberId===m.id).sort((a,b)=>(b.requestedAt||0)-(a.requestedAt||0));
  const statusLabel = { pending:'待审核', approved:'已通过', rejected:'已拒绝' };
  const statusColor = { pending:'var(--tasks)', approved:'var(--shopping)', rejected:'var(--pin)' };
  const reqRows = myRequests.map(r=>{
    const rw = state.rewards.find(x=>x.id===r.rewardId);
    const user = userById(r.memberId);
    return `
      <div class="member-row">
        <div style="flex:1;">
          <div style="font-weight:700;">${escapeHtml(rw?rw.title:'（奖励已删除）')}</div>
          <div class="task-meta">${admin ? escapeHtml(user?.displayName||'—')+' · ' : ''}${rw?rw.cost:'-'} 积分</div>
        </div>
        <span class="chip" style="background:var(--card-alt);color:${statusColor[r.status]};">${statusLabel[r.status]}</span>
        ${(admin && r.status==='pending') ? `
          <button class="btn btn-sm" style="background:var(--shopping);" onclick="resolveRedemption('${r.id}','approved')">通过</button>
          <button class="btn btn-sm btn-ghost" onclick="resolveRedemption('${r.id}','rejected')">拒绝</button>` : ''}
      </div>`;
  }).join('');

  main.innerHTML = headHtml('🎁','var(--rewards)','积分商店','用做家务和学习赚到的积分，兑换你想要的奖励')
    + manageHtml
    + `<div class="panel"><h3>🛍️ 可兑换奖励</h3><div class="board-grid">${shopCards || '<div class="empty-state">管理员还没有设置奖励</div>'}</div></div>`
    + `<div class="panel"><h3>📋 兑换记录</h3>${reqRows || '<div class="empty-state">还没有兑换记录</div>'}</div>`;
}
function addReward(){
  const title = document.getElementById('rw-title').value.trim();
  const cost = parseInt(document.getElementById('rw-cost').value) || 1;
  if(!title){ alert('请输入奖励名称'); return; }
  const m = me();
  state.rewards.push({ id: uid('rw'), familyId: m.familyId, title, cost, createdBy: m.id });
  saveState(); renderRewardsTab();
}
function deleteReward(id){
  if(!confirm('删除这个奖励吗？')) return;
  state.rewards = state.rewards.filter(r=>r.id!==id);
  saveState(); renderRewardsTab();
}
function redeemReward(rewardId){
  const m = me();
  const rw = state.rewards.find(r=>r.id===rewardId); if(!rw) return;
  if(userAvailablePoints(m.id) < rw.cost){ alert('积分不足'); return; }
  state.redemptions.push({ id: uid('rdm'), familyId: m.familyId, rewardId, memberId:m.id, status:'pending', requestedAt: Date.now(), resolvedAt:null });
  saveState(); renderRewardsTab(); refreshSidebarPoints();
}
function resolveRedemption(id, decision){
  const r = state.redemptions.find(x=>x.id===id); if(!r) return;
  r.status = decision; r.resolvedAt = Date.now();
  saveState(); renderRewardsTab(); refreshSidebarPoints();
}

        <div class="pin"></div>
        <div class="task-meta" style="display:flex;justify-content:space-between;gap:8px;">
          <span>${escapeHtml(from?.displayName||'—')} → ${toLabel}</span>
          <span>${formatDT(msg.createdAt)}</span>
        </div>
        <div class="task-title" style="font-size:14px;font-weight:600;white-space:pre-wrap;margin-top:6px;">${escapeHtml(msg.content)}</div>
        ${canDelete ? `<div class="task-actions"><button class="btn btn-sm btn-ghost" onclick="deleteMessage('${msg.id}')">删除</button></div>` : ''}
      </div>`;
  }).join('');

  main.innerHTML = headHtml('💬','var(--rewards)','家庭留言板','给家人留一句话，重要提醒或悄悄话都可以')
    + `<div class="panel">
        <h3>✏️ 写留言</h3>
        <div class="row">
          <div class="field" style="flex:2;"><label>内容</label><textarea id="msg-content" rows="2" placeholder="想对家人说的话…"></textarea></div>
          <div class="field" style="max-width:170px;"><label>发送给</label><select id="msg-to">${recipientOptions}</select></div>
          <button class="btn" style="background:var(--rewards);" onclick="postMessage()">发布留言</button>
        </div>
      </div>
      <div class="board-grid">${cards || '<div class="empty-state">还没有留言，写第一条吧！</div>'}</div>`;
}
function postMessage(){
  const content = document.getElementById('msg-content').value.trim();
  const toVal = document.getElementById('msg-to').value;
  if(!content){ alert('请输入留言内容'); return; }
  const m = me();
  state.messages.push({ id: uid('msg'), familyId:m.familyId, fromId:m.id, toId: toVal==='all'?null:toVal, content, createdAt: Date.now(), readBy:[m.id] });
  saveState();
  renderMessagesTab();
  showToast('💬','留言已发布','var(--rewards)');
}
function deleteMessage(id){
  if(!confirm('删除这条留言吗？')) return;
  state.messages = state.messages.filter(x=>x.id!==id);
  saveState(); renderMessagesTab();
}

/* ============================================================
   MEMBERS TAB (admin only)
   ============================================================ */
function renderMembersTab(){
  if(!isAdmin()){ switchTab('tasks'); return; }
  const main = document.getElementById('main-content');
  const fam = myFamily();
  const users = familyUsers();
  const m = me();

  const rows = users.map(u=>`
    <div class="member-row">
      <div class="avatar" style="background:${avatarColorFor(u.id)}">${u.displayName.slice(0,1)}</div>
      <div style="flex:1;min-width:140px;">
        <div style="font-weight:700;font-size:14px;">${escapeHtml(u.displayName)} ${u.id===m.id?'（你）':''}</div>
        <div class="task-meta">@${escapeHtml(u.username)} · ⭐ ${userAvailablePoints(u.id)} 积分</div>
      </div>
      <span class="chip ${ROLE_BADGE_CLASS[u.role]}">${ROLE_LABEL[u.role]}</span>
      ${u.id!==m.id ? `
        <select class="role-select" onchange="changeRole('${u.id}', this.value)">
          <option value="admin" ${u.role==='admin'?'selected':''}>管理员</option>
          <option value="member" ${u.role==='member'?'selected':''}>家庭成员</option>
          <option value="child" ${u.role==='child'?'selected':''}>儿童</option>
        </select>
        <button class="btn btn-sm btn-ghost" onclick="removeMember('${u.id}')">移除</button>` : ''}
    </div>`).join('');

  main.innerHTML = headHtml('👨‍👩‍👧','var(--calendar)','家庭成员','管理成员角色与权限，分享邀请码邀请更多人')
    + `<div class="invite-box">
        <div>${fam.cloudSynced ? '☁️ 云端邀请码' : '💾 本机邀请码'}</div>
        <div class="invite-code">${escapeHtml(fam.code)}</div>
        <button class="btn btn-sm btn-ghost" onclick="copyInviteCode()">复制</button>
        <div class="task-meta" style="flex:1 1 200px;">
          ${fam.cloudSynced
            ? `已连接云端同步，任何联网设备使用此邀请码即可加入 <b>${escapeHtml(fam.name)}</b>，数据会自动双向同步。`
            : `⚠️ 当前家庭未连接云端，此邀请码<b>仅在本设备/浏览器内有效</b>，无法在其他设备加入。`}
        </div>
        ${!fam.cloudSynced ? `<button class="btn btn-sm" style="background:var(--calendar);" onclick="retryCloudSync()">重试云同步</button>` : ''}
      </div>
      <div class="panel">
        <h3>家庭成员（共 ${users.length} 人）</h3>
        ${rows || '<div class="empty-state">暂无成员</div>'}
      </div>
      <div class="panel">
        <h3>🔐 角色权限说明</h3>
        <table class="perm-table">
          <tr><th>权限</th><th>管理员</th><th>家庭成员</th><th>儿童</th></tr>
          <tr><td>发布 / 删除任务</td><td>✅</td><td>—</td><td>—</td></tr>
          <tr><td>完成自己的任务</td><td>✅</td><td>✅</td><td>✅</td></tr>
          <tr><td>添加 / 删除日历事件</td><td>✅</td><td>✅</td><td>只读</td></tr>
          <tr><td>添加 / 删除购物条目</td><td>✅</td><td>✅</td><td>只能勾选</td></tr>
          <tr><td>布置学习任务</td><td>✅</td><td>—</td><td>—</td></tr>
          <tr><td>记录学习并自动计分</td><td>✅</td><td>✅</td><td>需管理员确认</td></tr>
          <tr><td>审核学习记录 / 兑换申请</td><td>✅</td><td>—</td><td>—</td></tr>
          <tr><td>兑换积分商店奖励</td><td>✅</td><td>需审批</td><td>需审批</td></tr>
          <tr><td>发布留言</td><td>✅</td><td>✅</td><td>✅</td></tr>
          <tr><td>管理成员与角色</td><td>✅</td><td>—</td><td>—</td></tr>
        </table>
      </div>`;
}
function changeRole(userId, newRole){
  const u = userById(userId); if(!u) return;
  u.role = newRole;
  saveState(); renderMembersTab();
}
function removeMember(userId){
  if(!confirm('确定要将该成员移出家庭吗？这不会删除该成员已产生的任务记录。')) return;
  state.users = state.users.filter(u=>u.id!==userId);
  saveState(); renderMembersTab();
}

/* ============================================================
   SETTINGS TAB
   ============================================================ */
function renderSettingsTab(){
  const main = document.getElementById('main-content');
  const fam = myFamily();
  main.innerHTML = headHtml('⚙️','var(--ink-soft)','设置','账户、通知与云同步偏好')
    + `<div class="panel">
        <h3>🌓 显示模式</h3>
        <p class="task-meta" style="margin-bottom:12px;">当前：${state.theme==='dark'?'深色模式':'浅色模式'}</p>
        <button class="btn btn-ghost" onclick="toggleDark()">切换为${state.theme==='dark'?'浅色':'深色'}模式</button>
      </div>
      <div class="panel">
        <h3>🔔 提醒与通知</h3>
        <p class="task-meta" style="margin-bottom:12px;">开启后，任务到期、日历事件、新留言、待审批事项等会通过浏览器系统通知提醒你（需保持网页在浏览器中打开）。当前状态：${notifStatusLabel()}</p>
        <button class="btn btn-ghost" onclick="requestNotifPermission()">开启浏览器通知</button>
      </div>
      <div class="panel">
        <h3>☁️ 云同步</h3>
        <p class="task-meta" style="margin-bottom:10px;">${fam?.cloudSynced ? '你的家庭数据已连接云端，邀请码可在任意联网设备使用，操作后会自动推送，并每 20 秒左右自动拉取一次最新数据。' : '当前家庭未连接云端，邀请码仅在本设备可用。'}</p>
        <p class="task-meta" style="margin-bottom:14px;color:var(--ink-faint);">说明：云同步基于第三方免费 JSON 存储服务（jsonblob.com）实现，让这个单文件 App 在没有自建服务器的情况下也能跨设备共享数据。请勿存放高度敏感信息，也不保证服务始终可用；云端不可用时会自动退回本机模式。</p>
        <div class="row">
          <button class="btn btn-ghost" onclick="manualSync()">🔄 立即同步</button>
          ${!fam?.cloudSynced ? `<button class="btn" style="background:var(--calendar);" onclick="retryCloudSync()">尝试连接云端</button>` : ''}
        </div>
      </div>
      <div class="panel">
        <h3>🔑 修改密码</h3>
        <div class="row">
          <div class="field"><label>当前密码</label><input type="password" id="set-oldpw"></div>
          <div class="field"><label>新密码</label><input type="password" id="set-newpw"></div>
          <button class="btn" style="background:var(--ink);" onclick="changePassword()">更新密码</button>
        </div>
        <div class="form-msg" id="set-pw-msg"></div>
      </div>
      <div class="panel">
        <h3>ℹ️ 关于数据</h3>
        <p class="task-meta">数据保存在<b>当前浏览器</b>的本地存储（localStorage）中；若云同步已连接，还会镜像保存到云端共享地址以便跨设备访问。清除浏览器数据将导致本机缓存丢失，若云同步已开启可通过重新加入家庭找回。</p>
      </div>`;
}
async function changePassword(){
  const msgEl = document.getElementById('set-pw-msg');
  const oldpw = document.getElementById('set-oldpw').value;
  const newpw = document.getElementById('set-newpw').value;
  const m = me();
  const oldHash = await hashPassword(oldpw);
  if(oldHash !== m.passwordHash){ msgEl.textContent='当前密码不正确'; msgEl.className='form-msg'; return; }
  if(!newpw || newpw.length<4){ msgEl.textContent='新密码至少 4 位'; msgEl.className='form-msg'; return; }
  m.passwordHash = await hashPassword(newpw);
  saveState();
  msgEl.className='form-msg ok'; msgEl.textContent='密码已更新';
  document.getElementById('set-oldpw').value=''; document.getElementById('set-newpw').value='';
}

/* ---------------- boot ---------------- */
(function boot(){
  state = loadState();
  if(state.theme==='dark') document.documentElement.classList.add('dark');
  setFamilyMode('create');
  if(state.session.userId && state.users.some(u=>u.id===state.session.userId)){
    enterApp();
  }
})();
</script>
</body>
</html>
