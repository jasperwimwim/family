<meta name="theme-color" content="#c7a877">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家庭管理器">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#dfe6d4;
    --board:#c7a877;
    --card:#fffdf6;
    --card-alt:#fff7e4;
    --ink:#3a332b;
    --ink-soft:#736a5c;
    --ink-faint:#a89d8a;
    --line: rgba(58,51,43,0.14);
    --pin:#c8503f;
    --shadow: 0 10px 22px rgba(40,32,18,0.18), 0 2px 4px rgba(40,32,18,0.12);

    --tasks:#d99b2b;      --tasks-soft:#f6e3b0;
    --calendar:#4d7fab;   --calendar-soft:#cfe1ef;
    --shopping:#5c8c4c;   --shopping-soft:#dcecd3;
    --study:#3f8f7c;      --study-soft:#cfe7df;
    --rewards:#b8567e;    --rewards-soft:#f3d9e4;

    --radius: 10px;
    --font-hand: 'Ma Shan Zheng', cursive;
    --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    --font-num: 'Inter', var(--font-body);
  }
  html.dark{
    --bg:#1c1914; --board:#3c3427; --card:#2c2721; --card-alt:#332c23;
    --ink:#ede4d4; --ink-soft:#bcaf99; --ink-faint:#8a7d68;
    --line: rgba(237,228,212,0.12); --pin:#e06a53;
    --shadow: 0 10px 24px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.35);
    --tasks-soft:#4a3f24; --calendar-soft:#233846; --shopping-soft:#293a24;
    --study-soft:#203a32; --rewards-soft:#3f2634;
  }

  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; background: var(--bg); color: var(--ink); font-family: var(--font-body); transition: background .3s ease, color .3s ease; position:relative;}
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  #auth-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .auth-card{width:100%; max-width:420px; background:var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding:36px 32px 30px; position:relative; transform:rotate(-0.4deg);}
  .pin{width:14px;height:14px;border-radius:50%; background: radial-gradient(circle at 35% 30%, #ff8a75, var(--pin)); box-shadow: 0 3px 5px rgba(0,0,0,.35); position:absolute; top:-7px; left:50%; transform:translateX(-50%);}
  .auth-title{font-family:var(--font-hand); font-size:44px; text-align:center; margin:6px 0 0; color:var(--ink);}
  .auth-sub{text-align:center; color:var(--ink-soft); font-size:13px; margin:0 0 22px; letter-spacing:.5px;}
  .tabbar{display:flex; gap:6px; background:var(--board); padding:4px; border-radius:999px; margin-bottom:22px;}
  .tabbar button{flex:1; border:none; background:transparent; padding:9px 0; border-radius:999px; font-weight:700; font-size:14px; color:#fff; opacity:.75;}
  .tabbar button.active{background:var(--card); color:var(--ink); opacity:1;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%; padding:10px 12px; border-radius:8px; border:1.5px solid var(--line); background:var(--card-alt); color:var(--ink); font-size:16px; outline:none; resize:vertical;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--tasks);}
  .radio-row{display:flex; gap:10px; margin-bottom:14px;}
  .radio-opt{flex:1; border:1.5px solid var(--line); border-radius:8px; padding:9px; text-align:center; font-size:13px; font-weight:600; color:var(--ink-soft); background:var(--card-alt);}
  .radio-opt.sel{border-color:var(--tasks); color:var(--tasks); background:var(--tasks-soft);}
  .primary-btn{width:100%; padding:12px; border:none; border-radius:8px; background:var(--ink); color:var(--card); font-weight:700; font-size:14.5px; margin-top:6px;}
  .primary-btn:hover{opacity:.92;}
  .primary-btn:disabled{opacity:.55;cursor:not-allowed;}
  .form-msg{font-size:12.5px; color:var(--pin); margin:-6px 0 12px; min-height:14px;}
  .form-msg.ok{color:var(--shopping);}
  .hint{font-size:12px; color:var(--ink-faint); margin:-8px 0 14px; line-height:1.5;}

  #app-screen{display:none; min-height:100vh;}
  .shell{display:grid; grid-template-columns:220px 1fr; min-height:100vh;}
  .sidebar{background:var(--board); padding:22px 14px; display:flex; flex-direction:column; gap:6px; position:relative;}
  .brand{font-family:var(--font-hand); color:#fff8ea; font-size:30px; text-align:center; margin:0 0 4px;}
  .brand-sub{text-align:center; color:rgba(255,255,255,.75); font-size:11px; margin-bottom:20px; letter-spacing:.5px;}
  .navitem{display:flex; align-items:center; gap:9px; padding:10px 12px; border-radius:8px; border:none; background:transparent; color:rgba(255,255,255,.82); font-size:14px; font-weight:600; text-align:left;}
  .navitem .ico{font-size:16px;}
  .navitem:hover{background:rgba(255,255,255,.12);}
  .navitem.active{background:var(--card); color:var(--ink); box-shadow: var(--shadow);}
  .nav-badge{margin-left:auto; background:var(--pin); color:#fff; font-size:10px; font-weight:800; padding:1px 6px; border-radius:999px;}
  .sidebar-foot{margin-top:auto; padding-top:14px; border-top:1px solid rgba(255,255,255,.18);}
  .userchip{display:flex; align-items:center; gap:9px; padding:8px 6px; color:#fff;}

  .pet-emoji{font-size:70px; text-align:center; line-height:1; margin:6px 0 10px;}

  .role-badge-admin{background:var(--tasks-soft); color:var(--tasks);}

  .perm-table th{color:var(--ink-soft); font-weight:700;}

    .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}

<body>

<div id="auth-screen">

  <div class="auth-card">
    <div class="pin"></div>
    <button id="lang-toggle-btn" onclick="toggleLang()" style="position:absolute;top:14px;right:14px;border:1.5px solid var(--line);background:var(--card-alt);color:var(--ink-soft);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer;">EN</button>
    <h1 class="auth-title">FamilyManager Pro</h1>
    <p class="auth-sub" id="auth-tagline">家务 · 日历 · 购物 · 积分商店 · 留言板</p>

    <div class="tabbar">
      <button id="tab-login-btn" class="active" onclick="switchAuthTab('login')">登录</button>
      <button id="tab-register-btn" onclick="switchAuthTab('register')">注册</button>
    </div>

    <div id="login-form">
      <div class="field"><label id="login-username-label">用户名</label><input type="text" id="login-username" placeholder="输入用户名" autocomplete="username"></div>
      <div class="field"><label id="login-password-label">密码</label><input type="password" id="login-password" placeholder="输入密码" autocomplete="current-password"></div>
      <div class="form-msg" id="login-msg"></div>
      <button class="primary-btn" id="login-btn" onclick="handleLogin()">登录账号</button>
      <button type="button" id="login-sync-link" onclick="toggleLoginSyncPanel()" style="background:none;border:none;padding:0;margin-top:10px;font-size:12px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;">这是新设备？先同步家庭数据再登录</button>
      <div id="login-sync-panel" style="display:none;margin-top:12px;">
        <hr class="soft">
        <div class="field">
          <label id="login-sync-label">云端邀请码 / 离线数据包</label>
          <textarea id="login-sync-code" rows="2" placeholder="粘贴家人的云端邀请码，或对方在「设置」页导出的离线数据包"></textarea>
        </div>
        <button class="btn btn-ghost" id="login-sync-submit" style="width:100%;" onclick="syncBeforeLogin()">🔄 同步家庭数据</button>
        <div class="form-msg" id="login-sync-msg"></div>
      </div>
    </div>

    <div id="register-form" style="display:none;">
      <div class="field"><label id="reg-nickname-label">显示昵称</label><input type="text" id="reg-displayname" placeholder="例如：爸爸 / Jasper"></div>
      <div class="field"><label id="reg-username-label">用户名</label><input type="text" id="reg-username" placeholder="登录用的用户名" autocomplete="username"></div>
      <div class="field"><label id="reg-password-label">密码</label><input type="password" id="reg-password" placeholder="设置密码" autocomplete="new-password"></div>
      <div class="field"><label id="reg-password2-label">确认密码</label><input type="password" id="reg-password2" placeholder="再次输入密码" autocomplete="new-password"></div>

      <div class="radio-row">
        <div class="radio-opt sel" id="opt-create" onclick="setFamilyMode('create')">🏠 创建新家庭</div>
        <div class="radio-opt" id="opt-join" onclick="setFamilyMode('join')">🔑 加入已有家庭</div>
      </div>

      <div id="family-create-field" class="field">
        <label id="reg-familyname-label">家庭名称</label>
        <input type="text" id="reg-familyname" placeholder="例如：陈家小屋">
        <div class="hint" id="reg-createhint" style="margin-top:8px;">创建时会自动尝试连接云端，这样邀请码可以在任何联网设备上使用；若云端暂时不可用，会退回到"仅本设备可用"的邀请码。</div>
      </div>
      <div id="family-join-field" class="field" style="display:none;">
        <label id="reg-familycode-label">家庭邀请码 / 离线数据包</label>
        <textarea id="reg-familycode" rows="2" placeholder="向家庭管理员索取邀请码，或粘贴对方在「设置」页导出的一长串数据包文字"></textarea>
        <div class="hint" id="reg-joinhint" style="margin-top:8px;">推荐：让管理员在「设置」页导出<b>离线数据包</b>发给你（微信/短信都行），粘贴到这里，<b>完全不需要联网</b>，最可靠。云端邀请码需要双方都能联网访问第三方同步服务，不一定总能成功。加入后默认是"家庭成员"身份，管理员之后可在「家庭成员」页调整为"管理员"。</div>
      </div>

      <button class="navitem" data-tab="members" id="nav-members" onclick="switchTab('members')"><span class="ico">👨‍👩‍👧</span><span id="nav-members-label">家庭成员</span></button>

/* ========================================================================
   FamilyManager Pro — 单文件本地应用
   本地数据保存在浏览器 localStorage 中；若"云同步"连接成功，家庭数据还会
   镜像保存到一个第三方免费 JSON 存储服务（jsonblob.com）上的共享地址，
   从而让邀请码可以在其它联网设备上使用、数据可以跨设备同步。
   这只是一个轻量的"尽力而为"方案，不是自建服务器，请勿存放高度敏感信息，
   也不保证第三方服务始终可用；云端不可用时应用会自动退回到本机模式。

   角色与权限设计（现为两级）：
     · 管理员 admin  —— 家长/负责人：管理成员与角色、发布/删除任务、管理
                        日历与购物、审批兑换申请、手动调整成员积分。管理员
                        不参与积分体系，界面上不显示积分条。
     · 家庭成员 member —— 完成自己的任务（含背单词/数学题等系统任务），
                        自由增删日历/购物，可用积分兑换奖励（需管理员审批），
                        用做任务赚到的金币喂养电子宠物、或赠送金币给其他成员。
   ======================================================================== */

function tr(key){
  const entry = I18N[key];
  if(!entry) return key;
  return entry[state && state.lang] || entry.zh;
}
const ROLE_LABEL = { get admin(){ return tr('admin'); }, get member(){ return tr('member'); } };
const ROLE_BADGE_CLASS = { admin:'role-badge-admin', member:'role-badge-member' };

/* ---------------- storage ---------------- */
function defaultState(){
  return {
    users: [], families: [], tasks: [], events: [], shopping: [],
    study: [], rewards: [], redemptions: [], messages: [],
    pointAdjustments: [], coinTx: [], pets: [],
    session: { userId: null }, theme: 'light', lang: 'zh'
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const s = Object.assign(defaultState(), JSON.parse(raw));
    // 兼容旧版本：儿童角色已取消，统一并入"家庭成员"
    (s.users||[]).forEach(u=>{ if(u.role === 'child') u.role = 'member'; });
    return s;
  }catch(e){
    console.error('加载数据失败，使用初始状态', e);
    return defaultState();
  }
}
function saveStateLocalOnly(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function saveState(){
  saveStateLocalOnly();
  const m = me();
  if(m) schedulePush(m.familyId);
}

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function genFamilyCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<6;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
async function hashPassword(pw){
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function avatarColorFor(userId){
  let h=0; for(const ch of userId) h=(h*31+ch.charCodeAt(0))%AVATAR_COLORS.length;
  return AVATAR_COLORS[Math.abs(h)];
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){
  const d1=new Date(a+'T00:00:00'), d2=new Date(b+'T00:00:00');
  return Math.round((d2-d1)/(1000*60*60*24));
}
function formatDT(ts){
  const d = new Date(ts);
  return `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
/* 如果用户正在某个输入框/文本框里打字，就不要用后台自动同步的结果去整体重绘页面，
   否则会打断输入、内容"跳出去"或被清空。等用户输入完/切换焦点后，下一次同步再刷新。 */
function isTypingInMainContent(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = el.tagName;
  if(tag !== 'INPUT' && tag !== 'TEXTAREA') return false;
  const mc = document.getElementById('main-content');
  return !!(mc && mc.contains(el));
}

/* ---------------- 手动导出 / 导入（离线可用，不依赖任何网络服务，最可靠的跨设备方式） ---------------- */
const PKG_PREFIX = 'FMPRO1:';
function b64EncodeUnicode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64DecodeUnicode(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function exportFamilyPackage(){
  const fam = myFamily(); if(!fam) return '';
  const payload = familyCloudPayload(fam.id);
  return PKG_PREFIX + b64EncodeUnicode(JSON.stringify(payload));
}
function parseFamilyPackage(text){
  const raw = (text||'').trim();
  if(!raw.startsWith(PKG_PREFIX)) return null;
  try{
    const json = b64DecodeUnicode(raw.slice(PKG_PREFIX.length));
    const payload = JSON.parse(json);
    if(payload && payload.family && payload.family.id) return payload;
  }catch(e){ console.warn('数据包解析失败', e); }
  return null;
}
/* 尝试解析加入家庭时填写的内容：优先当作离线数据包（100% 可靠，不需要联网），
   其次当作云端邀请码（需要联网连接第三方服务），最后退回本机已知的邀请码。 */
async function resolveJoinInput(rawInput){
  const raw = (rawInput||'').trim();
  if(!raw) return { fam:null, reason:'empty' };

  const pkg = parseFamilyPackage(raw);
  if(pkg){
    mergeCloudPayloadIntoLocal(pkg);
    const fam = state.families.find(f=>f.id===pkg.family.id);
    return { fam, reason:'package' };
  }

  try{
    const cloudPayload = await cloudGet(raw);
    if(cloudPayload && cloudPayload.family){
      mergeCloudPayloadIntoLocal(cloudPayload);
      const fam = state.families.find(f=>f.id===cloudPayload.family.id);
      fam.cloudSynced = true; fam.cloudId = raw; fam.code = raw;
      return { fam, reason:'cloud' };
    }
  }catch(e){ /* 不是有效的云端ID，或云端不可用/无法从本机联网访问，继续尝试本机匹配 */ }

  const upper = raw.toUpperCase();
  const localFam = state.families.find(f => f.code === upper || f.code === raw);
  if(localFam) return { fam:localFam, reason:'local' };
  return { fam:null, reason:'notfound' };
}

/* ---------------- cloud sync ---------------- */
async function cloudCreate(payload){
  const res = await fetch(CLOUD_API_BASE, { method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body: JSON.stringify(payload) });
  if(!res.ok) throw new Error('cloud create failed: '+res.status);
  const loc = res.headers.get('Location') || res.headers.get('location');
  if(!loc) throw new Error('未能获取云端地址（可能是网络限制了响应头）');
  const id = loc.split('/').filter(Boolean).pop();
  if(!id) throw new Error('无法解析云端 ID');
  return id;
}
async function cloudGet(id){
  const res = await fetch(CLOUD_API_BASE + '/' + encodeURIComponent(id), { headers:{'Accept':'application/json'} });
  if(!res.ok) throw new Error('cloud get failed: '+res.status);
  return await res.json();
}
async function cloudPut(id, payload){
  const res = await fetch(CLOUD_API_BASE + '/' + encodeURIComponent(id), { method:'PUT', headers:{'Content-Type':'application/json','Accept':'application/json'}, body: JSON.stringify(payload) });
  if(!res.ok) throw new Error('cloud put failed: '+res.status);
  return true;
}
async function cloudDelete(id){
  const res = await fetch(CLOUD_API_BASE + '/' + encodeURIComponent(id), { method:'DELETE' });
  if(!res.ok && res.status !== 404) throw new Error('cloud delete failed: '+res.status);
  return true;
}
function familyCloudPayload(familyId){
  return {
    family: state.families.find(f=>f.id===familyId),
    users: state.users.filter(u=>u.familyId===familyId),
    tasks: state.tasks.filter(t=>t.familyId===familyId),
    events: state.events.filter(e=>e.familyId===familyId),
    shopping: state.shopping.filter(s=>s.familyId===familyId),
    study: state.study.filter(s=>s.familyId===familyId),
    rewards: state.rewards.filter(r=>r.familyId===familyId),
    redemptions: state.redemptions.filter(r=>r.familyId===familyId),
    messages: state.messages.filter(x=>x.familyId===familyId),
    pointAdjustments: state.pointAdjustments.filter(x=>x.familyId===familyId),
    coinTx: state.coinTx.filter(x=>x.familyId===familyId),
    pets: state.pets.filter(x=>x.familyId===familyId),
    updatedAt: Date.now()
  };
}
function mergeCloudPayloadIntoLocal(payload){
  if(!payload || !payload.family) return;
  const fid = payload.family.id;

  // 关键修复：如果云端快照比本机更旧（例如刚创建/加入家庭时，云端推送尚未完成），
  // 绝不能把"当前正登录的这个用户"从本地覆盖丢失，否则会导致 me() 变成
  // undefined，进而每个页面渲染都崩溃、主内容区域一片空白。
  const currentUserId = state.session.userId;
  const myLocalRecord = state.users.find(u => u.id === currentUserId && u.familyId === fid);

  state.families = state.families.filter(f=>f.id!==fid);
  state.families.push(payload.family);

  const scopes = [
    ['tasks', payload.tasks], ['events', payload.events], ['shopping', payload.shopping],
    ['study', payload.study], ['rewards', payload.rewards],
    ['redemptions', payload.redemptions], ['messages', payload.messages],
    ['pointAdjustments', payload.pointAdjustments], ['coinTx', payload.coinTx], ['pets', payload.pets]
  ];
  scopes.forEach(([key, arr])=>{
    state[key] = state[key].filter(x=>x.familyId!==fid).concat(arr||[]);
  });

  let cloudUsers = payload.users || [];
  cloudUsers = cloudUsers.map(u => u.role === 'child' ? Object.assign({}, u, { role:'member' }) : u);
  if(myLocalRecord && !cloudUsers.some(u=>u.id===myLocalRecord.id)){
    cloudUsers = cloudUsers.concat([myLocalRecord]);
  }
  state.users = state.users.filter(u=>u.familyId!==fid).concat(cloudUsers);
}
let pushTimer = null;
function schedulePush(familyId){
  const fam = state.families.find(f=>f.id===familyId);
  if(!fam || !fam.cloudSynced) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>{ pushFamilyToCloud(familyId); }, 1200);
}
async function pushFamilyToCloud(familyId){
  const fam = state.families.find(f=>f.id===familyId);
  if(!fam || !fam.cloudSynced) return;
  try{
    setSyncStatus('syncing');
    await cloudPut(fam.cloudId, familyCloudPayload(familyId));
    setSyncStatus('synced');
  }catch(e){
    console.warn('云同步推送失败', e);
    setSyncStatus('error');
  }
}
async function pullFamilyFromCloud(familyId){
  const fam = state.families.find(f=>f.id===familyId);
  if(!fam || !fam.cloudSynced) return false;
  try{
    setSyncStatus('syncing');
    const payload = await cloudGet(fam.cloudId);
    mergeCloudPayloadIntoLocal(payload);
    saveStateLocalOnly();
    setSyncStatus('synced');
    return true;
  }catch(e){
    console.warn('云同步拉取失败', e);
    setSyncStatus('error');
    return false;
  }
}
function setSyncStatus(s){ syncStatus = s; updateSyncBadge(); }
function updateSyncBadge(){
  const el = document.getElementById('sync-badge'); if(!el) return;
  const fam = myFamily(); if(!fam){ return; }
  if(!fam.cloudSynced){ el.textContent='💾 本机模式'; el.title='当前家庭未连接云端，邀请码仅本设备可用，点击可在设置页重试连接'; return; }
  const map = { synced:'☁️ 已同步', error:'⚠️ 同步失败', syncing:'☁️ 同步中…', idle:'☁️ 已连接' };
  el.textContent = map[syncStatus] || '☁️ 已连接';
  el.title = '点击立即同步';
}
function manualSync(){
  const m = me(); if(!m) return;
  const fam = myFamily();
  if(!fam || !fam.cloudSynced){ showToast('💾','当前为本机模式，暂无云端可同步','var(--ink-soft)'); return; }
  showToast('☁️','正在同步…','var(--calendar)');
  pullFamilyFromCloud(m.familyId).then(ok=>{
    refreshSidebarChrome();
    switchTab(currentTab);
    showToast(ok?'✅':'⚠️', ok?'同步完成':'同步失败，请检查网络', ok?'var(--shopping)':'var(--pin)');
  });
}
function retryCloudSync(){
  const fam = myFamily(); if(!fam) return;
  showToast('☁️','正在尝试连接云端…','var(--calendar)');
  cloudCreate(familyCloudPayload(fam.id)).then(id=>{
    fam.cloudId = id; fam.cloudSynced = true; fam.code = id;
    saveState();
    refreshSidebarChrome();
    switchTab(currentTab);
    showToast('✅','云同步已开启，邀请码已更新','var(--shopping)');
  }).catch(()=>{ showToast('⚠️','云端连接失败，请稍后再试','var(--pin)'); });
}

function doImportPackage(){
  const msgEl = document.getElementById('import-pkg-msg');
  const box = document.getElementById('import-package-box');
  const text = box ? box.value.trim() : '';
  const pkg = parseFamilyPackage(text);
  if(!pkg){ msgEl.className='form-msg'; msgEl.textContent='无法识别这段数据包，请确认完整复制了对方导出的全部文字。'; return; }
  if(pkg.family.id !== myFamily()?.id){
    msgEl.className='form-msg'; msgEl.textContent='这个数据包属于另一个家庭，无法导入到当前账号。';
    return;
  }
  mergeCloudPayloadIntoLocal(pkg);
  saveStateLocalOnly();
  msgEl.className='form-msg ok'; msgEl.textContent='导入成功，数据已更新！';
  if(box) box.value='';
  refreshSidebarChrome();
  switchTab(currentTab);
  showToast('✅','已导入最新数据','var(--shopping)');
}

/* ---------------- 清除数据 ---------------- */
function clearLocalData(){
  if(!confirm('确定要清除这台设备上的全部本地数据吗？\n\n这会删除本机保存的所有账号、家庭、任务、日历、购物、留言等记录，且无法撤销。\n（如果家庭已开启云同步，云端的数据不会受影响，之后可以用邀请码/离线数据包重新同步回来。）')) return;
  if(!confirm('再次确认：真的要清空本机数据吗？此操作不可撤销。')) return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}
async function deleteCloudFamilyData(){
  const fam = myFamily();
  if(!fam || !isAdmin()) return;
  if(!fam.cloudSynced){ showToast('💾','当前家庭没有连接云端，无需删除','var(--ink-soft)'); return; }
  if(!confirm(`确定要删除「${fam.name}」在云端保存的数据吗？\n\n删除后，其他家人设备将无法再通过邀请码同步到这份数据（除非有人导出过离线数据包）。此操作不可撤销。`)) return;
  if(!confirm('再次确认：真的要永久删除云端数据吗？')) return;
  try{
    await cloudDelete(fam.cloudId);
    fam.cloudSynced = false;
    fam.cloudId = null;
    fam.code = genFamilyCode();
    saveStateLocalOnly();
    refreshSidebarChrome();
    switchTab(currentTab);
    showToast('🗑️','云端数据已删除，家庭已切换为本机模式','var(--pin)');
  }catch(e){
    console.warn('删除云端数据失败', e);
    showToast('⚠️','删除失败：'+e.message,'var(--pin)');
  }
}

/* ---------------- toasts ---------------- */
function showToast(icon, text, color){
  const stack = document.getElementById('toast-stack'); if(!stack) return;
  const el = document.createElement('div');
  el.className='toast'; el.style.borderLeftColor = color || 'var(--tasks)';
  el.innerHTML = `${icon} ${escapeHtml(text)}`;
  stack.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 6000);
}

async function handleRegister(){
  const msgEl = document.getElementById('reg-msg');
  const btn = document.getElementById('reg-btn');
  msgEl.className='form-msg'; msgEl.textContent='';

  const displayName = document.getElementById('reg-displayname').value.trim();
  const username = document.getElementById('reg-username').value.trim();
  const password = document.getElementById('reg-password').value;
  const password2 = document.getElementById('reg-password2').value;

  if(!displayName || !username || !password){ msgEl.textContent='请完整填写昵称、用户名和密码'; return; }
  if(password.length < 4){ msgEl.textContent='密码至少 4 位'; return; }
  if(password !== password2){ msgEl.textContent='两次输入的密码不一致'; return; }
  if(state.users.some(u => u.username.toLowerCase() === username.toLowerCase())){ msgEl.textContent='用户名已被使用，换一个试试'; return; }

  btn.disabled = true;
  let familyId, role;

  if(familyModeChoice === 'create'){
    const familyName = document.getElementById('reg-familyname').value.trim();
    if(!familyName){ msgEl.textContent='请输入家庭名称'; btn.disabled=false; return; }
    const famRecord = { id: uid('fam'), name: familyName, code: genFamilyCode(), cloudId:null, cloudSynced:false, createdAt: Date.now() };
    msgEl.className='form-msg'; msgEl.style.color='var(--ink-soft)'; msgEl.textContent='正在尝试连接云端…';
    try{
      const initialPayload = { family: famRecord, users:[], tasks:[], events:[], shopping:[], study:[], rewards:[], redemptions:[], messages:[], pointAdjustments:[], coinTx:[], pets:[], updatedAt: Date.now() };
      const cloudId = await cloudCreate(initialPayload);
      famRecord.cloudId = cloudId; famRecord.code = cloudId; famRecord.cloudSynced = true;
    }catch(e){
      console.warn('云端创建失败，使用本机邀请码', e);
      famRecord.cloudSynced = false;
    }
    state.families.push(famRecord);
    familyId = famRecord.id; role = 'admin';
  }else{
    const rawCode = document.getElementById('reg-familycode').value.trim();
    if(!rawCode){ msgEl.textContent='请输入家庭邀请码，或粘贴管理员导出的数据包'; btn.disabled=false; return; }
    msgEl.className='form-msg'; msgEl.style.color='var(--ink-soft)'; msgEl.textContent='正在查找家庭…';

    const { fam: famRecord, reason } = await resolveJoinInput(rawCode);
    if(!famRecord){
      msgEl.className='form-msg'; msgEl.style.color='var(--pin)';
      msgEl.textContent='无法识别该邀请码/数据包。跨设备加入建议优先使用「设置」页导出的离线数据包（无需联网、最可靠）；若使用云端邀请码，请确认已联网。';
      btn.disabled=false; return;
    }
    if(famRecord.cloudSynced === undefined) famRecord.cloudSynced = false;
    familyId = famRecord.id; role = 'member';
  }

  const passwordHash = await hashPassword(password);
  const user = { id: uid('u'), username, passwordHash, displayName, familyId, role, createdAt: Date.now() };
  state.users.push(user);
  state.session.userId = user.id;
  saveStateLocalOnly();
  // 立即（而不是延迟防抖）把包含这个新用户的完整数据推送到云端，
  // 避免随后 enterApp() 里的首次拉取，拉到还没写入这个新用户的旧快照。
  await pushFamilyToCloud(familyId);

  msgEl.className='form-msg ok'; msgEl.style.color='';
  msgEl.textContent='注册成功，正在进入…';
  btn.disabled=false;
  setTimeout(enterApp, 300);
}

async function handleLogin(){
  const msgEl = document.getElementById('login-msg');
  msgEl.textContent='';
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  if(!username || !password){ msgEl.textContent='请输入用户名和密码'; return; }

  const user = state.users.find(u => u.username.toLowerCase() === username.toLowerCase());
  if(!user){
    msgEl.textContent='用户名不存在。如果这是新设备，请点击下方"先同步家庭数据"完成同步后再登录。';
    const panel = document.getElementById('login-sync-panel');
    if(panel) panel.style.display='block';
    return;
  }
  const hash = await hashPassword(password);
  if(hash !== user.passwordHash){ msgEl.textContent='密码错误'; return; }

  state.session.userId = user.id;
  saveState();
  enterApp();
}
function toggleLoginSyncPanel(){
  const el = document.getElementById('login-sync-panel'); if(!el) return;
  el.style.display = el.style.display==='none' ? 'block' : 'none';
}
function syncBeforeLogin(){

    msgEl.textContent = `同步成功（${reason==='package'?'离线数据包':reason==='cloud'?'云端':'本机记录'}）！现在可以用你的用户名和密码登录了。`;
  }).catch((e)=>{
    msgEl.className='form-msg'; msgEl.style.color='var(--pin)';
    msgEl.textContent='同步失败：'+e.message;
  });
}
function handleLogout(){
  state.session.userId = null;
  saveStateLocalOnly();
  if(window.__fmproSyncInterval){ clearInterval(window.__fmproSyncInterval); window.__fmproSyncInterval=null; }
  document.getElementById('app-screen').style.display='none';
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('login-username').value='';
  document.getElementById('login-password').value='';
}

/* ---------------- context helpers ---------------- */
function me(){ return state.users.find(u => u.id === state.session.userId); }
function myFamily(){ const m = me(); return m ? state.families.find(f => f.id === m.familyId) : null; }
function familyUsers(){ const m = me(); return state.users.filter(u => u.familyId === m.familyId); }
function isAdmin(){ const m = me(); return !!m && m.role === 'admin'; }
function userById(id){ return state.users.find(u=>u.id===id); }
function familyTasks(){ const m=me(); return state.tasks.filter(t=>t.familyId===m.familyId); }
function familyEvents(){ const m=me(); return state.events.filter(e=>e.familyId===m.familyId); }
function familyShopping(){ const m=me(); return state.shopping.filter(s=>s.familyId===m.familyId); }
function familyRewards(){ const m=me(); return state.rewards.filter(r=>r.familyId===m.familyId); }
function familyRedemptions(){ const m=me(); return state.redemptions.filter(r=>r.familyId===m.familyId); }
function familyMessages(){ const m=me(); return state.messages.filter(x=>x.familyId===m.familyId); }

/* ---------------- points engine ---------------- */
function userTaskPoints(userId){ return state.tasks.filter(t=>t.assigneeId===userId && t.status==='done').reduce((s,t)=>s+t.points,0); }
function userPointAdjustments(userId){ return state.pointAdjustments.filter(a=>a.userId===userId).reduce((s,a)=>s+a.amount,0); }
function userEarnedPoints(userId){ return userTaskPoints(userId) + userPointAdjustments(userId); }
function userSpentPoints(userId){
  return state.redemptions.filter(r=>r.memberId===userId && r.status==='approved')
    .reduce((s,r)=>{ const rw = state.rewards.find(x=>x.id===r.rewardId); return s+(rw?rw.cost:0); },0);
}
function userPendingPoints(userId){
  return state.redemptions.filter(r=>r.memberId===userId && r.status==='pending')
    .reduce((s,r)=>{ const rw = state.rewards.find(x=>x.id===r.rewardId); return s+(rw?rw.cost:0); },0);
}
function userAvailablePoints(userId){ return userEarnedPoints(userId) - userSpentPoints(userId) - userPendingPoints(userId); }
function adjustPoints(userId){
  const amtInput = document.getElementById('adj-amt-'+userId);
  const reasonInput = document.getElementById('adj-reason-'+userId);
  const amt = parseInt(amtInput ? amtInput.value : '');
  const reason = (reasonInput ? reasonInput.value.trim() : '') || '管理员手动调整';
  if(!amt){ alert(tr('nonZeroAdjustAlert')); return; }
  const target = userById(userId);
  const m = me();
  state.pointAdjustments.push({ id: uid('adj'), familyId: m.familyId, userId, amount: amt, reason, createdBy: m.id, createdAt: Date.now() });
  saveState();
  renderMembersTab();
  showToast(amt>0?'➕':'➖', `已为 ${target?target.displayName:'该成员'} ${amt>0?'增加':'减少'} ${Math.abs(amt)} 积分`, amt>0?'var(--shopping)':'var(--pin)');
}

/* ---------------- coins & pet engine ---------------- */
function familyCoinTx(){ const m=me(); return state.coinTx.filter(x=>x.familyId===m.familyId); }
function userCoins(userId){ return state.coinTx.filter(x=>x.userId===userId).reduce((s,x)=>s+x.amount,0); }
function grantCoins(userId, amount, reason){
  const m = me();
  state.coinTx.push({ id: uid('coin'), familyId: m.familyId, userId, amount, reason, createdAt: Date.now() });
}

/* ---------------- reminders ---------------- */
function computeReminders(){
  const m = me(); if(!m) return [];
  const list = [];
  const today = todayStr();

  familyTasks().filter(t=>t.status==='pending' && t.assigneeId===m.id && t.createdBy!==m.id && !(t.seenBy||[]).includes(m.id)).forEach(t=>{
    list.push({ id:'newtask_'+t.id, icon:'🆕', text:'新任务：'+t.title+(t.dueDate?'（截止 '+t.dueDate+'）':''), tab:'tasks', color:'var(--tasks)' });
  });
  familyTasks().filter(t=>t.status==='pending' && t.assigneeId===m.id && t.dueDate && t.dueDate<=today).forEach(t=>{
    const overdue = t.dueDate < today;
    list.push({ id:'task_'+t.id, icon:'📝', text:(overdue?'已逾期：':'今天要完成：')+t.title, tab:'tasks', color:'var(--tasks)' });
  });
  familyEvents().forEach(e=>{
    if(!e.date) return;
    const diff = daysBetween(today, e.date);
    if(diff>=0 && diff<=2){
      list.push({ id:'event_'+e.id, icon:'📅', text:(diff===0?'今天：':diff+'天后：')+e.title, tab:'calendar', color:'var(--calendar)' });
    }
  });
  familyMessages().filter(msg=>(msg.toId===null||msg.toId===m.id) && msg.fromId!==m.id && !(msg.readBy||[]).includes(m.id))
    .forEach(msg=>{
      list.push({ id:'msg_'+msg.id, icon:'💬', text:(userById(msg.fromId)?.displayName||'有人')+' 给你留言了', tab:'messages', color:'var(--rewards)' });
    });
  if(isAdmin()){
    const pd = familyRedemptions().filter(r=>r.status==='pending').length;
    if(pd) list.push({ id:'redeem_pending', icon:'🎁', text:`有 ${pd} 个兑换申请待审批`, tab:'rewards', color:'var(--rewards)' });
  }
  return list;
}
function runReminderCheck(){
  const reminders = computeReminders();
  reminders.slice(0,5).forEach(r=>{
    if(!sessionNotifiedIds.has(r.id)){
      sessionNotifiedIds.add(r.id);
      showToast(r.icon, r.text, r.color);
      if(window.Notification && Notification.permission==='granted'){
        try{ new Notification('FamilyManager Pro', { body:r.text }); }catch(e){}
      }
    }
  });
}
function notifStatusLabel(){
  if(!('Notification' in window)) return '当前浏览器不支持';
  return { granted:'✅ 已开启', denied:'🚫 已被拒绝（请在浏览器设置中开启）', default:'尚未开启' }[Notification.permission];
}
function requestNotifPermission(){
  if(!('Notification' in window)){ alert(tr('notifNotSupported')); return; }
  Notification.requestPermission().then(()=>{ renderSettingsTab(); showToast('🔔','通知设置已更新','var(--tasks)'); });
}
function toggleNotifPanel(e){
  e.stopPropagation();
  const el = document.getElementById('notif-panel'); if(!el) return;
  el.style.display = el.style.display==='none' ? 'block':'none';
}
document.addEventListener('click', function(){
  const panel = document.getElementById('notif-panel');
  if(panel) panel.style.display='none';
});

/* ---------------- app shell ---------------- */
function refreshSidebarChrome(){
  const m = me(); if(!m) return;
  const fam = myFamily();
  document.getElementById('family-name-label').textContent = fam ? fam.name.toUpperCase() : '';
  document.getElementById('side-name').textContent = m.displayName;
  document.getElementById('side-role').textContent = ROLE_LABEL[m.role];
  const av = document.getElementById('side-avatar');
  av.textContent = m.displayName.slice(0,1);
  av.style.background = avatarColorFor(m.id);
  document.getElementById('nav-members').style.display = isAdmin() ? 'flex' : 'none';
  refreshSidebarPoints();
  updateNavBadges();
}
function refreshSidebarPoints(){
  const m = me(); if(!m) return;
  const el = document.getElementById('side-points');
  const ptsWord = tr('pointsWord'), coinWord = tr('coinsWord');
  if(isAdmin()){
    el.textContent = `💰 ${userCoins(m.id)} ${coinWord}`;
  }else{
    el.textContent = `⭐ ${userAvailablePoints(m.id)} ${ptsWord} · 💰 ${userCoins(m.id)} ${coinWord}`;
  }
}
function updateNavBadges(){
  const m = me(); if(!m) return;
  const unread = familyMessages().filter(msg=>(msg.toId===null||msg.toId===m.id) && msg.fromId!==m.id && !(msg.readBy||[]).includes(m.id)).length;
  const el = document.getElementById('nav-badge-messages');
  if(el){ el.style.display = unread>0 ? 'inline-block':'none'; el.textContent = unread; }
}

function enterApp(){
  const m = me();
  if(!m){ console.warn('enterApp 被调用时没有已登录用户，已跳过'); return; }
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
  refreshSidebarChrome();
  if(!isAdmin() && currentTab==='members') currentTab='tasks';

  if(!window.__fmproSyncInterval){
    window.__fmproSyncInterval = setInterval(()=>{
      const mm = me(); if(!mm) return;
      if(isTypingInMainContent()) return; // 正在打字时跳过这一轮自动刷新，避免打断输入
      pullFamilyFromCloud(mm.familyId).then(changed=>{
        runReminderCheck(); // 先弹提醒，再重绘页面（重绘会把当前标签页内容标记为"已读”)
        if(changed && !isTypingInMainContent()){ refreshSidebarChrome(); switchTab(currentTab); }
      });
    }, 20000);
  }
  pullFamilyFromCloud(m.familyId).then(()=>{
    refreshSidebarChrome();
    runReminderCheck(); // 必须在 switchTab 之前：进入任务页会把任务标记为"已读"，提醒要先弹出来
    switchTab(currentTab);
  });
}

function switchTab(tab){
  if(!me()) return;
  currentTab = tab;
  document.querySelectorAll('.navitem').forEach(el=>{ el.classList.toggle('active', el.dataset.tab === tab); });
  const renderers = {
    tasks: renderTasksTab, calendar: renderCalendarTab, shopping: renderShoppingTab,
    rewards: renderRewardsTab, messages: renderMessagesTab,
    members: renderMembersTab, settings: renderSettingsTab
  };
  refreshSidebarPoints();
  (renderers[tab] || renderTasksTab)();
  updateSyncBadge();
  updateNavBadges();
}

  const reminders = computeReminders();
  const notifItems = reminders.map(r=>`<div class="notif-item" onclick="switchTab('${r.tab}')"><span>${r.icon}</span><span>${escapeHtml(r.text)}</span></div>`).join('');
  return `
    <div class="main-head">
      <div>
        <h2 class="main-title"><span class="accent-dot" style="background:${color}"></span>${icon} ${title}</h2>
        <p class="main-desc">${desc}</p>
      </div>
      <div class="head-right">
        <span class="sync-badge" id="sync-badge" onclick="manualSync()">☁️</span>
        <div class="notif-wrap">
          <button class="bell-btn" onclick="toggleNotifPanel(event)">🔔${reminders.length?`<span class="badge">${reminders.length}</span>`:''}</button>
          <div id="notif-panel" class="notif-panel" style="display:none;">
            <div class="notif-panel-title">🔔 我的提醒</div>
            ${notifItems || '<div class="empty-state" style="padding:14px 6px;">暂时没有新提醒</div>'}
          </div>
        </div>
        <div class="points-pill" style="background:var(--tasks-soft);color:var(--tasks);">💰 ${userCoins(m.id)} 金币</div>
        ${!isAdmin() ? `<div class="points-pill">⭐ ${userAvailablePoints(m.id)} 积分</div>` : ''}
        <button class="dark-toggle" onclick="toggleDark()">${state.theme==='dark' ? '☀️ 浅色模式' : '🌙 深色模式'}</button>
      </div>
    </div>`;
}
function toggleDark(){
  state.theme = state.theme==='dark' ? 'light':'dark';
  document.documentElement.classList.toggle('dark', state.theme==='dark');
  saveState();
  switchTab(currentTab);
}

/* ============================================================
   TASKS TAB
   ============================================================ */
function renderTasksTab(){
  const main = document.getElementById('main-content');
  const m = me();
  const users = familyUsers();
  const admin = isAdmin();
  const assigneeOptions = users.map(u=>`<option value="${u.id}">${escapeHtml(u.displayName)}（${ROLE_LABEL[u.role].replace('👑 ','')}）</option>`).join('');

  let formHtml = '';
  if(admin){
    formHtml = `
      <div class="panel">
        <h3>${tr('publishTask')}</h3>
        <div class="row">
          <div class="field"><label>${tr('taskContent')}</label><input type="text" id="task-title" placeholder="${tr('taskContentPh')}"></div>
          <div class="field"><label>${tr('assignee')}</label><select id="task-assignee">${assigneeOptions}</select></div>
          <div class="field"><label>${tr('dueDate')}</label><input type="date" id="task-due"></div>
          <div class="field" style="max-width:100px;"><label>${tr('points')}</label><input type="number" id="task-points" value="10" min="1"></div>
        </div>
        <div class="row" style="margin-top:12px;">
          <div class="field" style="max-width:180px;"><label>${tr('taskType')}</label>
            <select id="task-type" onchange="onTaskTypeChange()">
              <option value="normal">${tr('normalTask')}</option>
              <option value="vocab">${tr('vocabTask')}</option>
              <option value="math">${tr('mathTask')}</option>
            </select>
          </div>
          <button class="btn" style="background:var(--tasks);" onclick="addTask()">${tr('publishBtn')}</button>
        </div>
        <div class="field" id="vocab-field" style="display:none;margin-top:10px;">
          <label>${tr('vocabListLabel')}</label>
          <textarea id="task-vocab-list" rows="4" placeholder="apple|苹果&#10;banana|香蕉"></textarea>
        </div>
        <div class="field" id="math-field" style="display:none;margin-top:10px;">
          <label>${tr('mathListLabel')}</label>
          <textarea id="task-math-list" rows="4" placeholder="3+5=?|8&#10;12-4=?|8"></textarea>
        </div>
      </div>`;
  }

  const all = familyTasks().sort((a,b)=> (a.status==='done')-(b.status==='done') || (a.dueDate||'').localeCompare(b.dueDate||''));
  const visible = admin ? all : all.filter(t => t.assigneeId === m.id);

  // 标记当前用户已经看到分配给自己的任务，让"新任务"提醒只出现一次
  let sawChanged = false;
  all.forEach(t=>{
    if(t.assigneeId===m.id && !(t.seenBy||[]).includes(m.id)){
      t.seenBy = t.seenBy || []; t.seenBy.push(m.id); sawChanged = true;
    }
  });
  if(sawChanged) saveState();

  const typeBadge = { normal:'', vocab:tr('vocabTask').replace('🔤 系统任务·','🔤 ').replace('🔤 System Task · ','🔤 '), math:tr('mathTask').replace('➗ 系统任务·','➗ ').replace('➗ System Task · ','➗ ') };

  const cards = visible.map(t=>{
    const assignee = userById(t.assigneeId);
    const done = t.status === 'done';
    const canComplete = !done && t.assigneeId === m.id;
    const isQuiz = t.taskType && t.taskType !== 'normal';
    const quizOpen = activeQuizTaskId === t.id;

    let actionHtml = '';
    if(canComplete && isQuiz){
      if(quizOpen){
        const items = t.quizItems || [];
        const fb = quizFeedback[t.id] || {};
        const rows = items.map((item,i)=>{
          const r = fb[i];
          const mark = r ? (r.ok ? ' ✅' : ' ❌') : '';
          const prefill = r ? escapeHtml(r.val) : '';
          return `<div style="margin:6px 0;">
            <div class="task-meta">${escapeHtml(item.q)}${mark}</div>
            <input type="text" class="mini-input" style="width:100%;" id="quiz-${t.id}-${i}" value="${prefill}" placeholder="${tr('answerPh')}">
          </div>`;
        }).join('');
        actionHtml = `<div style="margin-top:10px;">${rows}
          <div class="task-actions">
            <button class="btn btn-sm" style="background:var(--tasks);" onclick="submitQuiz('${t.id}')">${tr('submitAnswers')}</button>
            <button class="btn btn-sm btn-ghost" onclick="cancelQuiz()">${tr('cancel')}</button>
          </div>
        </div>`;
      }else{
        actionHtml = `<div class="task-actions"><button class="btn btn-sm" style="background:var(--tasks);" onclick="startQuiz('${t.id}')">${tr('startQuizBtn')}${(t.quizItems||[]).length}${tr('startQuizBtn2')}</button></div>`;
      }
    }

    return `
      <div class="card task-card ${done?'done':''}">
        <div class="pin"></div>
        ${isQuiz ? `<span class="chip" style="background:var(--tasks-soft);color:var(--tasks);">${typeBadge[t.taskType]}</span>` : ''}
        <div class="task-title ${done?'strike':''}" style="margin-top:${isQuiz?'6px':'2px'};">${done?'✅':'⬜'} ${escapeHtml(t.title)}</div>
        <div class="task-meta">${tr('assigneeLabel')}${escapeHtml(assignee ? assignee.displayName : tr('unknown'))}</div>
        <div class="task-meta">${tr('dueLabel')}${t.dueDate ? escapeHtml(t.dueDate) : tr('notSet')}</div>
        <div class="task-meta">${tr('publisherLabel')}${escapeHtml(userById(t.createdBy)?.displayName || tr('dash'))}</div>
        ${done ? `<div class="task-meta">${tr('completedAtLabel')}${escapeHtml(t.completedAt || '')}</div>` : ''}
        <div class="task-meta task-points">+${t.points}${tr('ptsCoinsSame')}</div>
        ${actionHtml}
        <div class="task-actions">
          ${(canComplete && !isQuiz) ? `<button class="btn btn-sm" style="background:var(--tasks);" onclick="completeTask('${t.id}')">${tr('completeBtn')}</button>` : ''}
          ${admin ? `<button class="btn btn-sm btn-ghost" onclick="deleteTask('${t.id}')">${tr('delete')}</button>` : ''}
        </div>
      </div>`;
  }).join('');

  main.innerHTML = headHtml('📝','var(--tasks)',tr('tasksTitle'), admin ? tr('tasksDescAdmin') : tr('tasksDescMember'))
    + formHtml
    + `<div class="board-grid">${cards || `<div class="empty-state">${admin?tr('noTasksAdmin'):tr('noTasksMember')}</div>`}</div>`;
}
function onTaskTypeChange(){
  const v = document.getElementById('task-type').value;
  document.getElementById('vocab-field').style.display = v==='vocab' ? 'block' : 'none';
  document.getElementById('math-field').style.display = v==='math' ? 'block' : 'none';
}
function parseQuizLines(text){
  return (text||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const idx = l.indexOf('|');
    if(idx < 0) return null;
    return { q: l.slice(0,idx).trim(), a: l.slice(idx+1).trim() };
  }).filter(Boolean);
}
function addTask(){
  const title = document.getElementById('task-title').value.trim();
  const assigneeId = document.getElementById('task-assignee').value;
  const dueDate = document.getElementById('task-due').value;
  const points = parseInt(document.getElementById('task-points').value) || 10;
  const taskType = document.getElementById('task-type').value;
  if(!title){ alert(tr('fillTaskTitleAlert')); return; }

  let quizItems = [];
  if(taskType === 'vocab'){
    quizItems = parseQuizLines(document.getElementById('task-vocab-list').value);
    if(!quizItems.length){ alert(tr('fillVocabAlert')); return; }
  }else if(taskType === 'math'){
    quizItems = parseQuizLines(document.getElementById('task-math-list').value);
    if(!quizItems.length){ alert(tr('fillMathAlert')); return; }
  }

  const m = me();
  state.tasks.push({
    id: uid('task'), familyId: m.familyId, title, assigneeId, dueDate, createdBy: m.id,
    status:'pending', points, completedAt:null, seenBy:[m.id],
    taskType, quizItems
  });
  saveState(); renderTasksTab();
}
function startQuiz(taskId){
  activeQuizTaskId = taskId;
  quizFeedback[taskId] = {};
  renderTasksTab();
}
function cancelQuiz(){
  activeQuizTaskId = null;
  renderTasksTab();
}
function submitQuiz(taskId){
  const t = state.tasks.find(x=>x.id===taskId); if(!t) return;
  const items = t.quizItems || [];
  const results = {};
  let allCorrect = items.length > 0;
  items.forEach((item,i)=>{
    const el = document.getElementById(`quiz-${taskId}-${i}`);
    const val = (el ? el.value : '').trim();
    const ok = val.toLowerCase() === String(item.a).trim().toLowerCase();
    results[i] = { ok, val };
    if(!ok) allCorrect = false;
  });
  quizFeedback[taskId] = results;
  if(allCorrect){
    activeQuizTaskId = null;
    delete quizFeedback[taskId];
    completeTask(taskId);
    showToast('🎉','练习全部正确，任务完成！','var(--tasks)');
  }else{
    renderTasksTab();
    showToast('📝','还有答案不对，改一下再提交吧','var(--pin)');
  }
}
function completeTask(taskId){
  const t = state.tasks.find(x=>x.id===taskId); if(!t) return;
  t.status='done'; t.completedAt = todayStr();
  grantCoins(t.assigneeId, t.points, '完成任务：'+t.title);
  saveState(); renderTasksTab(); refreshSidebarPoints();
}
function deleteTask(taskId){
  if(!confirm('确定删除这个任务吗？')) return;
  state.tasks = state.tasks.filter(t=>t.id!==taskId);
  saveState(); renderTasksTab();
}

/* ============================================================
   CALENDAR TAB
   ============================================================ */
function renderCalendarTab(){
  const main = document.getElementById('main-content');
  const m = me();
  const events = familyEvents().sort((a,b)=> (a.date||'').localeCompare(b.date||''));

  const cards = events.map(e=>{
    const d = e.date ? new Date(e.date+'T00:00:00') : null;
    const day = d ? d.getDate() : '--';
    const ym = d ? `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}` : '';
    const canDelete = isAdmin() || e.createdBy === m.id;
    return `
      <div class="card event-card">
        <div class="tape"></div>
        <div class="pin"></div>

function renderRewardsTab(){
  const main = document.getElementById('main-content');
  const m = me();
  const admin = isAdmin();
  const rewards = familyRewards();
  const redemptions = familyRedemptions();
  const myAvail = userAvailablePoints(m.id);

  const manageHtml = admin ? `
    <div class="panel">
      <h3>${tr('manageRewards')}</h3>
      <div class="row">
        <div class="field"><label>${tr('rewardName')}</label><input type="text" id="rw-title" placeholder="${tr('rewardNamePh')}"></div>
        <div class="field" style="max-width:120px;"><label>${tr('pointsNeeded')}</label><input type="number" id="rw-cost" value="20" min="1"></div>
        <button class="btn" style="background:var(--rewards);" onclick="addReward()">${tr('addReward')}</button>
      </div>
      <hr class="soft">
      ${rewards.map(r=>`
        <div class="member-row">
          <div style="flex:1;font-weight:700;">${escapeHtml(r.title)}</div>
          <span class="chip" style="background:var(--rewards-soft);color:var(--rewards);">${r.cost} ${tr('pointsWord')}</span>

        </div>`).join('') || `<div class="empty-state">${tr('noRewardsYet')}</div>`}
    </div>` : '';

  const shopCards = rewards.map(r=>{
    const canRedeem = myAvail >= r.cost;
    return `
      <div class="card reward-card">
        <div class="pin"></div>
        <div class="task-title">🎁 ${escapeHtml(r.title)}</div>
        <div class="cost-tag">${r.cost} ${tr('pointsWord')}</div>
        <div class="task-actions">
          <button class="btn btn-sm" style="background:var(--rewards);" ${canRedeem?'':'disabled'} onclick="redeemReward('${r.id}')">${tr('redeem')}</button>
        </div>
        ${canRedeem ? '' : `<div class="task-meta" style="margin-top:8px;color:var(--pin);">${tr('insufficientPoints')}</div>`}
      </div>`;
  }).join('');

  const myRequests = redemptions.filter(r=> admin ? true : r.memberId===m.id).sort((a,b)=>(b.requestedAt||0)-(a.requestedAt||0));
  const statusLabel = { pending:tr('statusPending'), approved:tr('statusApproved'), rejected:tr('statusRejected') };
  const statusColor = { pending:'var(--tasks)', approved:'var(--shopping)', rejected:'var(--pin)' };
  const reqRows = myRequests.map(r=>{
    const rw = state.rewards.find(x=>x.id===r.rewardId);
    const user = userById(r.memberId);
    return `
      <div class="member-row">
        <div style="flex:1;">
          <div style="font-weight:700;">${escapeHtml(rw?rw.title:tr('rewardDeleted'))}</div>
          <div class="task-meta">${admin ? escapeHtml(user?.displayName||tr('dash'))+' · ' : ''}${rw?rw.cost:'-'} ${tr('pointsWord')}</div>
        </div>
        <span class="chip" style="background:var(--card-alt);color:${statusColor[r.status]};">${statusLabel[r.status]}</span>
        ${(admin && r.status==='pending') ? `
          <button class="btn btn-sm" style="background:var(--shopping);" onclick="resolveRedemption('${r.id}','approved')">${tr('approve')}</button>
          <button class="btn btn-sm btn-ghost" onclick="resolveRedemption('${r.id}','rejected')">${tr('reject')}</button>` : ''}
      </div>`;
  }).join('');

  main.innerHTML = headHtml('🎁','var(--rewards)',tr('rewardsTitle'),tr('rewardsDesc'))
    + manageHtml
    + (!admin ? `<div class="panel"><h3>${tr('availableRewards')}</h3><div class="board-grid">${shopCards || `<div class="empty-state">${tr('noRewardsAdmin')}</div>`}</div></div>` : '')
    + `<div class="panel"><h3>${tr('redemptionHistory')}</h3>${reqRows || `<div class="empty-state">${tr('noRedemptions')}</div>`}</div>`;
}
function addReward(){
  const title = document.getElementById('rw-title').value.trim();
  const cost = parseInt(document.getElementById('rw-cost').value) || 1;
  if(!title){ alert(tr('fillRewardNameAlert')); return; }
  const m = me();
  state.rewards.push({ id: uid('rw'), familyId: m.familyId, title, cost, createdBy: m.id });
  saveState(); renderRewardsTab();
}
function deleteReward(id){
  if(!confirm('删除这个奖励吗？')) return;
  state.rewards = state.rewards.filter(r=>r.id!==id);
  saveState(); renderRewardsTab();
}
function redeemReward(rewardId){
  const m = me();
  const rw = state.rewards.find(r=>r.id===rewardId); if(!rw) return;
  if(userAvailablePoints(m.id) < rw.cost){ alert(tr('notEnoughPointsAlert')); return; }
  state.redemptions.push({ id: uid('rdm'), familyId: m.familyId, rewardId, memberId:m.id, status:'pending', requestedAt: Date.now(), resolvedAt:null });
  saveState(); renderRewardsTab(); refreshSidebarPoints();
}
function resolveRedemption(id, decision){
  const r = state.redemptions.find(x=>x.id===id); if(!r) return;
  r.status = decision; r.resolvedAt = Date.now();
  saveState(); renderRewardsTab(); refreshSidebarPoints();
}

async function giftCoins(){
  const m = me();
  const toId = document.getElementById('gift-to').value;
  const amount = parseInt(document.getElementById('gift-amount').value);
  const pw = document.getElementById('gift-password').value;
  const msgEl = document.getElementById('gift-msg');
  msgEl.className='form-msg'; msgEl.textContent='';
  if(!toId){ msgEl.textContent=tr('giftSelectRecipient'); return; }
  if(!amount || amount<=0){ msgEl.textContent=tr('giftValidAmount'); return; }
  if(userCoins(m.id) < amount){ msgEl.textContent=tr('giftNotEnoughCoins'); return; }
  if(!pw){ msgEl.textContent=tr('giftEnterPassword'); return; }
  const hash = await hashPassword(pw);
  if(hash !== m.passwordHash){ msgEl.textContent=tr('giftWrongPassword'); return; }
  const toUser = userById(toId);
  grantCoins(m.id, -amount, tr('giftSentTo')+toUser.displayName);
  grantCoins(toId, amount, tr('giftReceivedFrom')+m.displayName);
  saveState();
  msgEl.className='form-msg ok'; msgEl.textContent=tr('giftSuccess');
  document.getElementById('gift-amount').value='';
  document.getElementById('gift-password').value='';
  renderSettingsTab();
  showToast('🎁',`${tr('giftToastPrefix')}${amount}${tr('giftToastMid')}${toUser.displayName}`,'var(--tasks)');
}

        <button class="btn btn-ghost" onclick="toggleLang()">${state.lang==='en' ? '切换为中文' : 'Switch to English'}</button>
      </div>
      ${giftPanel}
      <div class="panel">
        <h3>${tr('notifTitle')}</h3>
        <p class="task-meta" style="margin-bottom:12px;">${tr('notifDesc')}${notifStatusLabel()}</p>
        <button class="btn btn-ghost" onclick="requestNotifPermission()">${tr('enableNotif')}</button>
      </div>
      <div class="panel">
        <h3>${tr('cloudSyncTitle')}</h3>
        <p class="task-meta" style="margin-bottom:10px;">${fam?.cloudSynced ? tr('cloudSyncOnDesc') : tr('cloudSyncOffDesc')}</p>
        <p class="task-meta" style="margin-bottom:14px;color:var(--ink-faint);">${tr('cloudSyncNote')}</p>
        <div class="row">
          <button class="btn btn-ghost" onclick="manualSync()">${tr('syncNowBtn')}</button>
          ${!fam?.cloudSynced ? `<button class="btn" style="background:var(--calendar);" onclick="retryCloudSync()">${tr('tryConnectCloud')}</button>` : ''}
          <button class="btn btn-ghost" onclick="testCloudConnection()">${tr('testCloudBtn')}</button>
        </div>
      </div>
      <div class="panel">
        <h3>${tr('offlinePkgTitle')}</h3>
        <p class="task-meta" style="margin-bottom:14px;">${tr('offlinePkgDesc')}</p>
        <div class="row" style="margin-bottom:10px;">
          <button class="btn" style="background:var(--tasks);" onclick="doExportPackage()">${tr('exportPkgBtn')}</button>
          <button class="btn btn-ghost" onclick="copyExportPackage()">${tr('copy')}</button>
        </div>
        <textarea id="export-package-box" rows="3" readonly style="width:100%;font-size:11px;" placeholder="${tr('exportPkgPh')}"></textarea>
        <hr class="soft">
        <p class="task-meta" style="margin-bottom:8px;">${tr('importUpdateDesc')}</p>
        <div class="row">
          <div class="field" style="flex:1;"><textarea id="import-package-box" rows="2" placeholder="${tr('importPkgPh')}"></textarea></div>
          <button class="btn" style="background:var(--calendar);" onclick="doImportPackage()">${tr('importUpdateBtn')}</button>
        </div>
        <div class="form-msg" id="import-pkg-msg"></div>
      </div>
      <div class="panel">
        <h3>${tr('changePasswordTitle')}</h3>
        <div class="row">
          <div class="field"><label>${tr('currentPassword')}</label><input type="password" id="set-oldpw"></div>
          <div class="field"><label>${tr('newPassword')}</label><input type="password" id="set-newpw"></div>
          <button class="btn" style="background:var(--ink);" onclick="changePassword()">${tr('updatePasswordBtn')}</button>
        </div>
        <div class="form-msg" id="set-pw-msg"></div>
      </div>
      <div class="panel">
        <h3>${tr('aboutDataTitle')}</h3>
        <p class="task-meta">${tr('aboutDataDesc')}</p>
      </div>
      <div class="panel" style="border:1.5px solid var(--pin);">
        <h3 style="color:var(--pin);">${tr('clearDataTitle')}</h3>
        <p class="task-meta" style="margin-bottom:14px;">${tr('clearDataDesc')}</p>
        <div class="row" style="margin-bottom:10px;">
          <div style="flex:1;min-width:220px;">
            <div style="font-weight:700;font-size:13.5px;margin-bottom:4px;">${tr('clearLocalTitle')}</div>
            <div class="task-meta" style="margin-bottom:10px;">${tr('clearLocalDesc')}</div>
            <button class="btn btn-sm" style="background:var(--pin);" onclick="clearLocalData()">${tr('clearLocalBtn')}</button>
          </div>
          ${isAdmin() ? `<div style="flex:1;min-width:220px;">
            <div style="font-weight:700;font-size:13.5px;margin-bottom:4px;">${tr('deleteCloudTitle')}</div>
            <div class="task-meta" style="margin-bottom:10px;">${fam?.cloudSynced ? tr('deleteCloudDescOn') : tr('deleteCloudDescOff')}</div>
            <button class="btn btn-sm" style="background:var(--pin);" ${fam?.cloudSynced?'':'disabled'} onclick="deleteCloudFamilyData()">${tr('deleteCloudBtn')}</button>
          </div>` : ''}
        </div>
        <p class="task-meta" style="color:var(--ink-faint);">${tr('clearDataHint')}</p>
      </div>`;
}
function changeNickname(){
  const msgEl = document.getElementById('nick-msg');
  const input = document.getElementById('nick-input');
  const name = input ? input.value.trim() : '';
  if(!name){ msgEl.className='form-msg'; msgEl.textContent='昵称不能为空'; return; }
  const m = me();
  m.displayName = name;
  saveState();
  refreshSidebarChrome();
  msgEl.className='form-msg ok'; msgEl.textContent='已保存';
  showToast('✅','昵称已更新','var(--tasks)');
}
async function changePassword(){
  const msgEl = document.getElementById('set-pw-msg');
  const oldpw = document.getElementById('set-oldpw').value;
  const newpw = document.getElementById('set-newpw').value;
  const m = me();
  const oldHash = await hashPassword(oldpw);
  if(oldHash !== m.passwordHash){ msgEl.textContent='当前密码不正确'; msgEl.className='form-msg'; return; }
  if(!newpw || newpw.length<4){ msgEl.textContent='新密码至少 4 位'; msgEl.className='form-msg'; return; }
  m.passwordHash = await hashPassword(newpw);
  saveState();
  msgEl.className='form-msg ok'; msgEl.textContent='密码已更新';
  document.getElementById('set-oldpw').value=''; document.getElementById('set-newpw').value='';
}

/* ---------------- boot ---------------- */
(function boot(){
  state = loadState();
  if(state.theme==='dark') document.documentElement.classList.add('dark');
  applyStaticTranslations();
  setFamilyMode('create');
  if(state.session.userId && state.users.some(u=>u.id===state.session.userId)){
    enterApp();
  }
})();
</script>
</body>
</html>
