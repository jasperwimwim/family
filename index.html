<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FamilyManager Pro · 家庭管理器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#dfe6d4;
    --board:#c7a877;
    --board-dark:#b3925f;
    --card:#fffdf6;
    --card-alt:#fff7e4;
    --ink:#3a332b;
    --ink-soft:#736a5c;
    --ink-faint:#a89d8a;
    --line: rgba(58,51,43,0.14);
    --pin:#c8503f;
    --shadow: 0 10px 22px rgba(40,32,18,0.18), 0 2px 4px rgba(40,32,18,0.12);

    --tasks:#d99b2b;
    --tasks-soft:#f6e3b0;
    --calendar:#4d7fab;
    --calendar-soft:#cfe1ef;
    --shopping:#5c8c4c;
    --shopping-soft:#dcecd3;
    --finance:#c2694a;
    --finance-soft:#f1d9cd;
    --stats:#7e5da3;
    --stats-soft:#e4d8ee;

    --radius: 10px;
    --font-hand: 'Ma Shan Zheng', cursive;
    --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    --font-num: 'Inter', var(--font-body);
  }
  html.dark{
    --bg:#1c1914;
    --board:#3c3427;
    --board-dark:#2c261c;
    --card:#2c2721;
    --card-alt:#332c23;
    --ink:#ede4d4;
    --ink-soft:#bcaf99;
    --ink-faint:#8a7d68;
    --line: rgba(237,228,212,0.12);
    --pin:#e06a53;
    --shadow: 0 10px 24px rgba(0,0,0,0.45), 0 2px 6px rgba(0,0,0,0.35);

    --tasks-soft:#4a3f24;
    --calendar-soft:#233846;
    --shopping-soft:#293a24;
    --finance-soft:#3f2a22;
    --stats-soft:#332a44;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    transition: background .3s ease, color .3s ease;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    opacity:.05;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  /* ---------- Auth screen ---------- */
  #auth-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .auth-card{
    width:100%;
    max-width:420px;
    background:var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding:36px 32px 30px;
    position:relative;
    transform:rotate(-0.4deg);
  }
  .pin{
    width:14px;height:14px;border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ff8a75, var(--pin));
    box-shadow: 0 3px 5px rgba(0,0,0,.35);
    position:absolute; top:-7px; left:50%; transform:translateX(-50%);
  }
  .auth-title{
    font-family:var(--font-hand);
    font-size:44px;
    text-align:center;
    margin:6px 0 0;
    color:var(--ink);
  }
  .auth-sub{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    margin:0 0 22px;
    letter-spacing:.5px;
  }
  .tabbar{
    display:flex;
    gap:6px;
    background:var(--board);
    padding:4px;
    border-radius:999px;
    margin-bottom:22px;
  }
  .tabbar button{
    flex:1;
    border:none;
    background:transparent;
    padding:9px 0;
    border-radius:999px;
    font-weight:700;
    font-size:14px;
    color:#fff;
    opacity:.75;
  }
  .tabbar button.active{
    background:var(--card);
    color:var(--ink);
    opacity:1;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field input, .field select{
    width:100%;
    padding:10px 12px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--card-alt);
    color:var(--ink);
    font-size:14px;
    outline:none;
  }
  .field input:focus, .field select:focus{border-color:var(--tasks);}
  .radio-row{display:flex; gap:10px; margin-bottom:14px;}
  .radio-opt{
    flex:1;
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:9px;
    text-align:center;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    background:var(--card-alt);
  }
  .radio-opt.sel{
    border-color:var(--tasks);
    color:var(--tasks);
    background:var(--tasks-soft);
  }
  .primary-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:var(--ink);
    color:var(--card);
    font-weight:700;
    font-size:14.5px;
    margin-top:6px;
  }
  .primary-btn:hover{opacity:.92;}
  .form-msg{
    font-size:12.5px;
    color:var(--pin);
    margin:-6px 0 12px;
    min-height:14px;
  }
  .form-msg.ok{color:var(--shopping);}

  /* ---------- App shell ---------- */
  #app-screen{display:none; min-height:100vh;}
  .shell{
    display:grid;
    grid-template-columns:220px 1fr;
    min-height:100vh;
  }
  .sidebar{
    background:var(--board);
    padding:22px 14px;
    display:flex;
    flex-direction:column;
    gap:6px;
    position:relative;
  }
  .brand{
    font-family:var(--font-hand);
    color:#fff8ea;
    font-size:30px;
    text-align:center;
    margin:0 0 4px;
  }
  .brand-sub{
    text-align:center;
    color:rgba(255,255,255,.75);
    font-size:11px;
    margin-bottom:20px;
    letter-spacing:.5px;
  }
  .navitem{
    display:flex;align-items:center;gap:9px;
    padding:10px 12px;
    border-radius:8px;
    border:none;
    background:transparent;
    color:rgba(255,255,255,.82);
    font-size:14px;
    font-weight:600;
    text-align:left;
  }
  .navitem .ico{font-size:16px;}
  .navitem:hover{background:rgba(255,255,255,.12);}
  .navitem.active{
    background:var(--card);
    color:var(--ink);
    box-shadow: var(--shadow);
  }
  .sidebar-foot{
    margin-top:auto;
    padding-top:14px;
    border-top:1px solid rgba(255,255,255,.18);
  }
  .userchip{
    display:flex;align-items:center;gap:9px;
    padding:8px 6px;
    color:#fff;
  }
  .avatar{
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:800; font-size:13px; color:#fff;
    flex-shrink:0;
  }
  .userchip .who{line-height:1.25;}
  .userchip .name{font-size:13px;font-weight:700;}
  .userchip .role{font-size:11px;opacity:.75;}
  .logout-btn{
    width:100%;margin-top:8px;
    background:rgba(0,0,0,.18);
    border:none;color:#fff;
    padding:8px;border-radius:7px;
    font-size:12.5px;font-weight:700;
  }

  .main{
    padding:26px 34px 60px;
    background-image:
      radial-gradient(circle at 8% 12%, rgba(0,0,0,.05) 0, transparent 40%),
      radial-gradient(circle at 92% 82%, rgba(0,0,0,.05) 0, transparent 40%);
  }
  .main-head{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:22px;
    flex-wrap:wrap;gap:10px;
  }
  .main-title{
    font-family:var(--font-hand);
    font-size:34px;
    margin:0;
  }
  .main-title .accent-dot{
    display:inline-block;width:10px;height:10px;border-radius:50%;
    margin-right:8px;
  }
  .main-desc{color:var(--ink-soft);font-size:13px;margin:2px 0 0;}
  .dark-toggle{
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--ink);
    padding:8px 14px;
    border-radius:999px;
    font-size:13px;font-weight:700;
    display:flex;align-items:center;gap:6px;
  }

  .board-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px,1fr));
    gap:18px;
  }
  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 16px 14px;
    position:relative;
  }
  .card .pin{top:-7px;}
  .panel{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px 22px;
    margin-bottom:22px;
  }
  .panel h3{
    margin:0 0 14px;
    font-size:15px;
    font-weight:800;
  }
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .row .field{flex:1;min-width:140px;margin-bottom:0;}
  .btn{
    border:none;border-radius:8px;padding:10px 16px;
    font-weight:700;font-size:13.5px;color:#fff;
  }
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
  .btn-ghost{
    background:transparent;
    border:1.5px solid var(--line);
    color:var(--ink-soft);
  }
  .chip{
    display:inline-flex;align-items:center;gap:5px;
    padding:3px 9px;border-radius:999px;
    font-size:11.5px;font-weight:700;
  }

  .task-card{border-top:5px solid var(--tasks);}
  .task-card.done{opacity:.6;}
  .task-title{font-size:15px;font-weight:800;margin:2px 0 6px;}
  .task-title.strike{text-decoration:line-through;color:var(--ink-faint);}
  .task-meta{font-size:12px;color:var(--ink-soft);margin:2px 0;}
  .task-points{
    font-family:var(--font-num);
    font-weight:800;color:var(--tasks);font-size:13px;
  }
  .task-actions{display:flex;gap:8px;margin-top:12px;}

  .event-card{border-top:5px solid var(--calendar);}
  .event-date{
    font-family:var(--font-num);
    font-weight:800;font-size:20px;color:var(--calendar);
  }
  .event-date .y{font-size:11px;color:var(--ink-faint);font-weight:600;display:block;}
  .tape{
    position:absolute; top:-9px; right:14px;
    width:44px;height:16px;
    background:var(--calendar-soft);
    opacity:.9;
    transform:rotate(3deg);
  }

  .shop-card{border-top:5px solid var(--shopping);}
  .shop-list{list-style:none;margin:0;padding:0;}
  .shop-list li{
    display:flex;align-items:center;gap:10px;
    padding:9px 4px;border-bottom:1px dashed var(--line);
    font-size:14px;
  }
  .shop-list li:last-child{border-bottom:none;}
  .shop-list li.done span.txt{text-decoration:line-through;color:var(--ink-faint);}
  .check{
    width:20px;height:20px;border-radius:6px;
    border:2px solid var(--shopping);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0; background:transparent; color:var(--shopping); font-weight:900; font-size:13px;
  }
  .check.on{background:var(--shopping);color:#fff;}

  .fin-card{border-top:5px solid var(--finance);}
  .stat-num{font-family:var(--font-num);font-weight:800;font-size:26px;}
  .stat-label{font-size:12px;color:var(--ink-soft);font-weight:700;}
  .fin-list{list-style:none;margin:0;padding:0;}
  .fin-list li{
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 2px;border-bottom:1px dashed var(--line);font-size:13.5px;
  }
  .fin-amt.in{color:var(--shopping);font-weight:800;font-family:var(--font-num);}
  .fin-amt.out{color:var(--pin);font-weight:800;font-family:var(--font-num);}

  .leaderboard{list-style:none;margin:0;padding:0;}
  .leaderboard li{
    display:flex;align-items:center;gap:12px;
    padding:11px 4px;border-bottom:1px dashed var(--line);
  }
  .lb-rank{width:26px;text-align:center;font-size:16px;font-weight:800;color:var(--ink-faint);}
  .lb-bar-wrap{flex:1;height:8px;background:var(--tasks-soft);border-radius:4px;overflow:hidden;}
  .lb-bar{height:100%;background:var(--tasks);}
  .lb-pts{font-family:var(--font-num);font-weight:800;font-size:13px;color:var(--tasks);width:52px;text-align:right;}

  .member-row{
    display:flex;align-items:center;gap:12px;
    padding:10px 4px;border-bottom:1px dashed var(--line);
  }
  .member-row:last-child{border-bottom:none;}
  .invite-box{
    display:flex;align-items:center;gap:10px;
    background:var(--card-alt);
    border:1.5px dashed var(--line);
    padding:12px 16px;border-radius:10px;
    margin-bottom:18px;
  }
  .invite-code{
    font-family:var(--font-num);font-weight:800;letter-spacing:3px;
    font-size:18px;color:var(--tasks);
  }
  .empty-state{
    text-align:center;color:var(--ink-faint);
    padding:30px 10px;font-size:13.5px;
  }
  select.role-select{
    padding:5px 8px;border-radius:6px;border:1.5px solid var(--line);
    background:var(--card-alt);color:var(--ink);font-size:12px;font-weight:700;
  }
  hr.soft{border:none;border-top:1px solid var(--line);margin:16px 0;}

  @media (max-width: 760px){
    .shell{grid-template-columns:1fr;}
    .sidebar{
      flex-direction:row;
      overflow-x:auto;
      align-items:center;
      padding:12px;
    }
    .brand,.brand-sub{display:none;}
    .navitem{white-space:nowrap;}
    .sidebar-foot{display:none;}
    .main{padding:18px;}
  }
</style>
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="pin"></div>
    <h1 class="auth-title">FamilyManager Pro</h1>
    <p class="auth-sub">家庭任务 · 日历 · 购物 · 账本 · 积分，一站管理</p>

    <div class="tabbar">
      <button id="tab-login-btn" class="active" onclick="switchAuthTab('login')">登录</button>
      <button id="tab-register-btn" onclick="switchAuthTab('register')">注册</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="login-form">
      <div class="field">
        <label>用户名</label>
        <input type="text" id="login-username" placeholder="输入用户名" autocomplete="username">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="login-password" placeholder="输入密码" autocomplete="current-password">
      </div>
      <div class="form-msg" id="login-msg"></div>
      <button class="primary-btn" onclick="handleLogin()">登录账号</button>
    </div>

    <!-- REGISTER FORM -->
    <div id="register-form" style="display:none;">
      <div class="field">
        <label>显示昵称</label>
        <input type="text" id="reg-displayname" placeholder="例如：爸爸 / Jasper">
      </div>
      <div class="field">
        <label>用户名</label>
        <input type="text" id="reg-username" placeholder="登录用的用户名" autocomplete="username">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="reg-password" placeholder="设置密码" autocomplete="new-password">
      </div>
      <div class="field">
        <label>确认密码</label>
        <input type="password" id="reg-password2" placeholder="再次输入密码" autocomplete="new-password">
      </div>

      <div class="radio-row">
        <div class="radio-opt sel" id="opt-create" onclick="setFamilyMode('create')">🏠 创建新家庭</div>
        <div class="radio-opt" id="opt-join" onclick="setFamilyMode('join')">🔑 加入已有家庭</div>
      </div>

      <div id="family-create-field" class="field">
        <label>家庭名称</label>
        <input type="text" id="reg-familyname" placeholder="例如：陈家小屋">
      </div>
      <div id="family-join-field" class="field" style="display:none;">
        <label>家庭邀请码</label>
        <input type="text" id="reg-familycode" placeholder="向家庭管理员索取邀请码" style="text-transform:uppercase;">
      </div>

      <div class="form-msg" id="reg-msg"></div>
      <button class="primary-btn" onclick="handleRegister()">创建账号</button>
    </div>
  </div>
</div>

<!-- ============ APP SCREEN ============ -->
<div id="app-screen">
  <div class="shell">
    <div class="sidebar">
      <div class="brand">🏠 家庭管理器</div>
      <div class="brand-sub" id="family-name-label">FAMILY</div>

      <button class="navitem" data-tab="tasks" onclick="switchTab('tasks')"><span class="ico">📝</span>家务任务</button>
      <button class="navitem" data-tab="calendar" onclick="switchTab('calendar')"><span class="ico">📅</span>家庭日历</button>
      <button class="navitem" data-tab="shopping" onclick="switchTab('shopping')"><span class="ico">🛒</span>购物清单</button>
      <button class="navitem" data-tab="finance" id="nav-finance" onclick="switchTab('finance')"><span class="ico">💰</span>家庭账本</button>
      <button class="navitem" data-tab="stats" onclick="switchTab('stats')"><span class="ico">📊</span>数据统计</button>
      <button class="navitem" data-tab="members" id="nav-members" onclick="switchTab('members')"><span class="ico">👨‍👩‍👧</span>家庭成员</button>
      <button class="navitem" data-tab="settings" onclick="switchTab('settings')"><span class="ico">⚙️</span>设置</button>

      <div class="sidebar-foot">
        <div class="userchip">
          <div class="avatar" id="side-avatar">?</div>
          <div class="who">
            <div class="name" id="side-name">-</div>
            <div class="role" id="side-role">-</div>
          </div>
        </div>
        <button class="logout-btn" onclick="handleLogout()">退出登录</button>
      </div>
    </div>

    <div class="main" id="main-content">
      <!-- rendered by JS -->
    </div>
  </div>
</div>

<script>
/* ========================================================================
   FamilyManager Pro — 单文件本地应用
   数据仅保存在当前浏览器的 localStorage 中（不联网、不同步）。
   密码经 SHA-256 哈希后存储，不以明文保存；但本应用仅供家庭本地使用，
   不具备生产级账户安全性，请勿存放高度敏感信息。
   ======================================================================== */

const STORAGE_KEY = 'fmpro_state_v2';
let state = null;
let currentTab = 'tasks';
let familyModeChoice = 'create';

const AVATAR_COLORS = ['#d99b2b','#4d7fab','#5c8c4c','#c2694a','#7e5da3','#3a8f8f','#a1653f'];

/* ---------------- storage ---------------- */
function defaultState(){
  return {
    users: [],
    families: [],
    tasks: [],
    events: [],
    shopping: [],
    finance: [],
    session: { userId: null },
    theme: 'light'
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){
    console.error('加载数据失败，使用初始状态', e);
    return defaultState();
  }
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function uid(prefix){
  return prefix + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
}
function genFamilyCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for(let i=0;i<6;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
async function hashPassword(pw){
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function avatarColorFor(userId){
  let h = 0;
  for(const ch of userId) h = (h*31 + ch.charCodeAt(0)) % AVATAR_COLORS.length;
  return AVATAR_COLORS[Math.abs(h)];
}

/* ---------------- auth screen logic ---------------- */
function switchAuthTab(which){
  document.getElementById('tab-login-btn').classList.toggle('active', which==='login');
  document.getElementById('tab-register-btn').classList.toggle('active', which==='register');
  document.getElementById('login-form').style.display = which==='login' ? 'block':'none';
  document.getElementById('register-form').style.display = which==='register' ? 'block':'none';
  document.getElementById('login-msg').textContent='';
  document.getElementById('reg-msg').textContent='';
}
function setFamilyMode(mode){
  familyModeChoice = mode;
  document.getElementById('opt-create').classList.toggle('sel', mode==='create');
  document.getElementById('opt-join').classList.toggle('sel', mode==='join');
  document.getElementById('family-create-field').style.display = mode==='create' ? 'block':'none';
  document.getElementById('family-join-field').style.display = mode==='join' ? 'block':'none';
}

async function handleRegister(){
  const msgEl = document.getElementById('reg-msg');
  msgEl.className='form-msg'; msgEl.textContent='';

  const displayName = document.getElementById('reg-displayname').value.trim();
  const username = document.getElementById('reg-username').value.trim();
  const password = document.getElementById('reg-password').value;
  const password2 = document.getElementById('reg-password2').value;

  if(!displayName || !username || !password){
    msgEl.textContent='请完整填写昵称、用户名和密码'; return;
  }
  if(password.length < 4){
    msgEl.textContent='密码至少 4 位'; return;
  }
  if(password !== password2){
    msgEl.textContent='两次输入的密码不一致'; return;
  }
  if(state.users.some(u => u.username.toLowerCase() === username.toLowerCase())){
    msgEl.textContent='用户名已被使用，换一个试试'; return;
  }

  let familyId, role;
  if(familyModeChoice === 'create'){
    const familyName = document.getElementById('reg-familyname').value.trim();
    if(!familyName){ msgEl.textContent='请输入家庭名称'; return; }
    const fam = { id: uid('fam'), name: familyName, code: genFamilyCode(), createdAt: Date.now() };
    state.families.push(fam);
    familyId = fam.id;
    role = 'admin';
  }else{
    const code = document.getElementById('reg-familycode').value.trim().toUpperCase();
    if(!code){ msgEl.textContent='请输入家庭邀请码'; return; }
    const fam = state.families.find(f => f.code === code);
    if(!fam){ msgEl.textContent='邀请码无效，请向家庭管理员确认'; return; }
    familyId = fam.id;
    role = 'member';
  }

  const passwordHash = await hashPassword(password);
  const user = {
    id: uid('u'),
    username, passwordHash, displayName,
    familyId, role,
    createdAt: Date.now()
  };
  state.users.push(user);
  state.session.userId = user.id;
  saveState();

  msgEl.className='form-msg ok';
  msgEl.textContent='注册成功，正在进入…';
  setTimeout(enterApp, 400);
}

async function handleLogin(){
  const msgEl = document.getElementById('login-msg');
  msgEl.textContent='';
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  if(!username || !password){ msgEl.textContent='请输入用户名和密码'; return; }

  const user = state.users.find(u => u.username.toLowerCase() === username.toLowerCase());
  if(!user){ msgEl.textContent='用户名不存在'; return; }
  const hash = await hashPassword(password);
  if(hash !== user.passwordHash){ msgEl.textContent='密码错误'; return; }

  state.session.userId = user.id;
  saveState();
  enterApp();
}

function handleLogout(){
  state.session.userId = null;
  saveState();
  document.getElementById('app-screen').style.display='none';
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('login-username').value='';
  document.getElementById('login-password').value='';
}

/* ---------------- helpers to get current context ---------------- */
function me(){ return state.users.find(u => u.id === state.session.userId); }
function myFamily(){ const m = me(); return state.families.find(f => f.id === m.familyId); }
function familyUsers(){ const m = me(); return state.users.filter(u => u.familyId === m.familyId); }
function isAdmin(){ const m = me(); return m && m.role === 'admin'; }
function userById(id){ return state.users.find(u=>u.id===id); }
function familyTasks(){ const m=me(); return state.tasks.filter(t=>t.familyId===m.familyId); }
function familyEvents(){ const m=me(); return state.events.filter(e=>e.familyId===m.familyId); }
function familyShopping(){ const m=me(); return state.shopping.filter(s=>s.familyId===m.familyId); }
function familyFinance(){ const m=me(); return state.finance.filter(f=>f.familyId===m.familyId); }

/* ---------------- app shell ---------------- */
function enterApp(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
  const m = me();
  document.getElementById('family-name-label').textContent = myFamily().name.toUpperCase();
  document.getElementById('side-name').textContent = m.displayName;
  document.getElementById('side-role').textContent = m.role==='admin' ? '👑 管理员' : '成员';
  const av = document.getElementById('side-avatar');
  av.textContent = m.displayName.slice(0,1);
  av.style.background = avatarColorFor(m.id);

  document.getElementById('nav-finance').style.display = isAdmin() ? 'flex' : 'none';
  document.getElementById('nav-members').style.display = isAdmin() ? 'flex' : 'none';

  if(!isAdmin() && (currentTab==='finance' || currentTab==='members')) currentTab='tasks';
  switchTab(currentTab);
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.navitem').forEach(el=>{
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  const renderers = {
    tasks: renderTasksTab,
    calendar: renderCalendarTab,
    shopping: renderShoppingTab,
    finance: renderFinanceTab,
    stats: renderStatsTab,
    members: renderMembersTab,
    settings: renderSettingsTab
  };
  (renderers[tab] || renderTasksTab)();
}

function headHtml(icon,color,title,desc){
  return `
    <div class="main-head">
      <div>
        <h2 class="main-title"><span class="accent-dot" style="background:${color}"></span>${icon} ${title}</h2>
        <p class="main-desc">${desc}</p>
      </div>
      <button class="dark-toggle" onclick="toggleDark()">${state.theme==='dark' ? '☀️ 浅色模式' : '🌙 深色模式'}</button>
    </div>`;
}

function toggleDark(){
  state.theme = state.theme==='dark' ? 'light':'dark';
  document.documentElement.classList.toggle('dark', state.theme==='dark');
  saveState();
  switchTab(currentTab);
}

/* ============================================================
   TASKS TAB
   ============================================================ */
function renderTasksTab(){
  const main = document.getElementById('main-content');
  const m = me();
  const users = familyUsers();
  const admin = isAdmin();

  const assigneeOptions = users.map(u=>`<option value="${u.id}">${escapeHtml(u.displayName)}</option>`).join('');

  let formHtml = '';
  if(admin){
    formHtml = `
      <div class="panel">
        <h3>➕ 发布新任务</h3>
        <div class="row">
          <div class="field">
            <label>任务内容</label>
            <input type="text" id="task-title" placeholder="例如：洗碗">
          </div>
          <div class="field">
            <label>负责人</label>
            <select id="task-assignee">${assigneeOptions}</select>
          </div>
          <div class="field">
            <label>截止日期</label>
            <input type="date" id="task-due">
          </div>
          <div class="field" style="max-width:100px;">
            <label>积分</label>
            <input type="number" id="task-points" value="10" min="1">
          </div>
          <button class="btn" style="background:var(--tasks);" onclick="addTask()">发布任务</button>
        </div>
      </div>`;
  }

  const all = familyTasks().sort((a,b)=> (a.status==='done')-(b.status==='done') || (a.dueDate||'').localeCompare(b.dueDate||''));
  const visible = admin ? all : all.filter(t => t.assigneeId === m.id);

  const cards = visible.map(t=>{
    const assignee = userById(t.assigneeId);
    const done = t.status === 'done';
    const canComplete = !done && t.assigneeId === m.id;
    const canDelete = admin;
    return `
      <div class="card task-card ${done?'done':''}">
        <div class="pin"></div>
        <div class="task-title ${done?'strike':''}">${done?'✅':'⬜'} ${escapeHtml(t.title)}</div>
        <div class="task-meta">负责人：${escapeHtml(assignee ? assignee.displayName : '未知')}</div>
        <div class="task-meta">截止：${t.dueDate ? escapeHtml(t.dueDate) : '未设置'}</div>
        <div class="task-meta">发布人：${escapeHtml(userById(t.createdBy)?.displayName || '—')}</div>
        ${done ? `<div class="task-meta">完成时间：${escapeHtml(t.completedAt || '')}</div>` : ''}
        <div class="task-meta task-points">+${t.points} 分</div>
        <div class="task-actions">
          ${canComplete ? `<button class="btn btn-sm" style="background:var(--tasks);" onclick="completeTask('${t.id}')">完成 ✅</button>` : ''}
          ${canDelete ? `<button class="btn btn-sm btn-ghost" onclick="deleteTask('${t.id}')">删除</button>` : ''}
        </div>
      </div>`;
  }).join('');

  main.innerHTML = headHtml('📝','var(--tasks)','家务任务', admin ? '发布、分配并跟踪全家的家务任务' : '查看并完成分配给你的任务')
    + formHtml
    + `<div class="board-grid">${cards || `<div class="empty-state">暂时没有任务，${admin?'去发布第一个任务吧！':'等待管理员分配任务。'}</div>`}</div>`;
}

function addTask(){
  const title = document.getElementById('task-title').value.trim();
  const assigneeId = document.getElementById('task-assignee').value;
  const dueDate = document.getElementById('task-due').value;
  const points = parseInt(document.getElementById('task-points').value) || 10;
  if(!title){ alert('请输入任务内容'); return; }
  const m = me();
  state.tasks.push({
    id: uid('task'), familyId: m.familyId, title, assigneeId,
    dueDate, createdBy: m.id, status:'pending', points, completedAt:null
  });
  saveState();
  renderTasksTab();
}
function completeTask(taskId){
  const t = state.tasks.find(x=>x.id===taskId);
  if(!t) return;
  t.status='done';
  t.completedAt = new Date().toISOString().slice(0,10);
  saveState();
  renderTasksTab();
}
function deleteTask(taskId){
  if(!confirm('确定删除这个任务吗？')) return;
  state.tasks = state.tasks.filter(t=>t.id!==taskId);
  saveState();
  renderTasksTab();
}

/* ============================================================
   CALENDAR TAB
   ============================================================ */
function renderCalendarTab(){
  const main = document.getElementById('main-content');
  const m = me();
  const events = familyEvents().sort((a,b)=> (a.date||'').localeCompare(b.date||''));

  const cards = events.map(e=>{
    const d = e.date ? new Date(e.date+'T00:00:00') : null;
    const day = d ? d.getDate() : '--';
    const ym = d ? `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}` : '';
    const canDelete = isAdmin() || e.createdBy === m.id;
    return `
      <div class="card event-card">
        <div class="tape"></div>

        <div class="event-date">${day}<span class="y">${ym}</span></div>

        ${e.note ? `<div class="task-meta">${escapeHtml(e.note)}</div>` : ''}
        <div class="task-meta">添加人：${escapeHtml(userById(e.createdBy)?.displayName || '—')}</div>
        <div class="task-actions">
          ${canDelete ? `<button class="btn btn-sm btn-ghost" onclick="deleteEvent('${e.id}')">删除</button>` : ''}
        </div>

  main.innerHTML = headHtml('📅','var(--calendar)','家庭日历','记录家人的生日、旅行和重要事件，避免遗忘')
    + `<div class="panel">
        <h3>➕ 添加事件</h3>
        <div class="row">
          <div class="field"><label>事件名称</label><input type="text" id="ev-title" placeholder="例如：妈妈生日"></div>
          <div class="field"><label>日期</label><input type="date" id="ev-date"></div>
          <div class="field"><label>备注</label><input type="text" id="ev-note" placeholder="可选"></div>
          <button class="btn" style="background:var(--calendar);" onclick="addEvent()">添加</button>

function addEvent(){

  if(!title || !date){ alert('请填写事件名称和日期'); return; }
  const m = me();
  state.events.push({ id: uid('ev'), familyId: m.familyId, title, date, note, createdBy: m.id });

  renderCalendarTab();

function deleteEvent(id){

function addShop(){

function addFinance(){

}

/* ============================================================
   STATS TAB
   ============================================================ */
function renderStatsTab(){
  const main = document.getElementById('main-content');
  const tasks = familyTasks();
  const total = tasks.length;
  const completed = tasks.filter(t=>t.status==='done').length;
  const rate = total ? Math.round(completed/total*100) : 0;

  const users = familyUsers();
  const pointsMap = users.map(u=>({
    user:u,
    points: tasks.filter(t=>t.assigneeId===u.id && t.status==='done').reduce((s,t)=>s+t.points,0)
  })).sort((a,b)=>b.points-a.points);
  const maxPts = Math.max(1, ...pointsMap.map(p=>p.points));
  const medals = ['🥇','🥈','🥉'];

  const lbHtml = pointsMap.map((p,i)=>`
    <li>
      <div class="lb-rank">${medals[i] || (i+1)}</div>
      <div class="avatar" style="width:28px;height:28px;font-size:11px;background:${avatarColorFor(p.user.id)}">${p.user.displayName.slice(0,1)}</div>
      <div style="flex:1;">
        <div style="font-size:13.5px;font-weight:700;">${escapeHtml(p.user.displayName)}</div>
        <div class="lb-bar-wrap"><div class="lb-bar" style="width:${(p.points/maxPts*100)}%;"></div></div>
      </div>
      <div class="lb-pts">${p.points}分</div>
    </li>`).join('');

  main.innerHTML = headHtml('📊','var(--stats)','数据统计','家务完成情况与积分排行榜')
    + `<div class="board-grid" style="margin-bottom:22px;">
        <div class="card" style="border-top:5px solid var(--stats);"><div class="pin"></div><div class="stat-label">总任务</div><div class="stat-num">${total}</div></div>
        <div class="card" style="border-top:5px solid var(--stats);"><div class="pin"></div><div class="stat-label">已完成</div><div class="stat-num">${completed}</div></div>
        <div class="card" style="border-top:5px solid var(--stats);"><div class="pin"></div><div class="stat-label">完成率</div><div class="stat-num">${rate}%</div></div>
      </div>
      <div class="panel">
        <h3>🏆 家务积分排行榜</h3>
        <ul class="leaderboard">${lbHtml || '<li class="empty-state" style="border:none;">暂无积分数据</li>'}</ul>
      </div>`;
}

          <div class="field"><label>当前密码</label><input type="password" id="set-oldpw"></div>
          <div class="field"><label>新密码</label><input type="password" id="set-newpw"></div>
          <button class="btn" style="background:var(--ink);" onclick="changePassword()">更新密码</button>
        </div>
        <div class="form-msg" id="set-pw-msg"></div>
      </div>
      <div class="panel">
        <h3>ℹ️ 关于数据</h3>
        <p class="task-meta">所有数据仅保存在<b>当前浏览器</b>的本地存储（localStorage）中，不会上传到任何服务器，也不会在设备间同步。清除浏览器数据将导致本应用的数据丢失，请注意备份。</p>
      </div>`;
}
async function changePassword(){
  const msgEl = document.getElementById('set-pw-msg');
  const oldpw = document.getElementById('set-oldpw').value;
  const newpw = document.getElementById('set-newpw').value;
  const m = me();
  const oldHash = await hashPassword(oldpw);
  if(oldHash !== m.passwordHash){ msgEl.textContent='当前密码不正确'; msgEl.className='form-msg'; return; }
  if(!newpw || newpw.length<4){ msgEl.textContent='新密码至少 4 位'; msgEl.className='form-msg'; return; }
  m.passwordHash = await hashPassword(newpw);
  saveState();
  msgEl.className='form-msg ok';
  msgEl.textContent='密码已更新';
  document.getElementById('set-oldpw').value='';
  document.getElementById('set-newpw').value='';
}

/* ---------------- boot ---------------- */
(function boot(){
  state = loadState();
  if(state.theme==='dark') document.documentElement.classList.add('dark');
  setFamilyMode('create');
  if(state.session.userId && state.users.some(u=>u.id===state.session.userId)){
    enterApp();
  }
})();
</script>
</body>
